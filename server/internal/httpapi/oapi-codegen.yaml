# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: httpapi
output: api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  # Keep schemas no path references: the realtime event payloads.
  skip-prune: true
