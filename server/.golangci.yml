version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
  exclusions:
    generated: strict
    presets: [std-error-handling]
formatters:
  enable: [gofumpt, goimports]
