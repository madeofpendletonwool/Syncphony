    # --- Realtime ---------------------------------------------------------------
    # These are pushed over the WebSocket at /ws/rooms/{roomId}, not served
    # from a path here.

    RoomEvent:
      type: object
      description: |
        A message on the room WebSocket, `GET /ws/rooms/{roomId}?since=<version>`.
        The socket needs the session cookie and is server-push only: send
        changes over the REST API.

        `data` by `type`:
        - `hello`: RoomHello. Always first.
        - `queue.updated`: QueueSnapshot. Sent after hello unless `since`
          equals the current version, then on every change.
        - `nowplaying.updated`: NowPlaying. Sent after hello, then on change.
        - `playback.notice`: PlaybackNotice. Something to tell members, like
          a song skipped because it couldn't play.
        - `member.joined`, `member.left`: User. Someone's first connection to
          the room opened, or their last one closed.
        - `link.status`: ServiceLink. One of your links changed status.
        - `room.updated`: Room. The room's name, settings or owner changed.
        - `room.deleted`: `{"roomId": ...}`. The room was deleted. It's the
          last event; the server then closes the socket with 4004.
        - `reaction.sent`: Reaction. Someone sent an emoji to the big screen.
        - `hearts.updated`: Hearts. Someone hearted a song, or took it back.
        - `night.ended`: Night. The night is over; crown its song of the night.
        - `guests.updated`: `{"roomId": ...}`. A guest joined or was removed,
          or the guest pass changed: fetch them again.
        - `members.updated`: RoomMembersChanged. Someone joined a room that
          isn't open, asked to, or left or was removed.

        A paired display connects with its display cookie instead, to its
        own room only. So does a signed-in user with `display=1`: either way
        the connection doesn't count as being in the room.

        Close code 1013 (try again later) means the client fell behind and
        missed events: reconnect with `since` set to the last version seen.
        Close code 4001 means the session ended; sign in again. Close code
        4003 means you can't open the room any more (you were removed, or
        it stopped being open to you); don't reconnect. Close code 4004
        means the room is gone; don't reconnect. A room you can't open is
        404, as if it weren't there.
      required: [type, data]
      properties:
        type:
          type: string
          enum: [hello, queue.updated, nowplaying.updated, playback.notice, member.joined, member.left, link.status, room.updated, room.deleted, reaction.sent, hearts.updated, night.ended, guests.updated, members.updated]
        version:
          type: integer
          format: int64
          description: Queue version, on `queue.updated` only.
        data:
          type: object

    RoomHello:
      type: object
      required: [roomId, roomName, you, members, serverTime]
      properties:
        roomId:
          type: string
        roomName:
          type: string
        you:
          type: string
          description: Your user ID; empty for a paired display.
        serverTime:
          type: string
          format: date-time
          description: |
            The server's clock as it sent this, to the millisecond. Clients
            correct for their own clock's offset when working out the playback
            position, so every screen in the room shows the same lyric line.
        members:
          type: array
          description: Everyone connected to the room right now, you included.
          items:
            $ref: "#/components/schemas/User"

    QueueSnapshot:
      type: object
      required: [roomId, version, items, upNext]
      properties:
        roomId:
          type: string
        version:
          type: integer
          format: int64
        items:
          type: array
          description: |
            The playing item and everything queued, grouped by who added it,
            each lane in order.
          items:
            $ref: "#/components/schemas/QueueItem"
        upNext:
          type: array
          description: |
            IDs of the queued items in the order they will play, as the room's
            fairness mode interleaves the lanes. The playing item isn't included.
          items:
            type: string

    QueueItem:
      type: object
      required: [id, addedBy, state, lanePosition, addedAt, track]
      properties:
        id:
          type: string
        addedBy:
          type: string
          description: |
            User ID. For an autopilot song, whose taste seeded it: the song
            isn't theirs, and isn't in their lane.
        state:
          type: string
          enum: [queued, playing, played, skipped, removed]
        lanePosition:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        track:
          $ref: "#/components/schemas/QueuedTrack"
        via:
          $ref: "#/components/schemas/PlaysVia"
        palette:
          $ref: "#/components/schemas/Palette"
        autopilot:
          $ref: "#/components/schemas/AutopilotPick"

    AutopilotPick:
      type: object
      description: |
        Set when autopilot queued the song, because the queue ran dry.
        Label it "Autopilot", not as anyone's. It plays after every
        member's song, takes nobody's turn, and anyone may remove it.
      properties:
        seedItemId:
          type: string
          description: The item whose song it's like. Absent for a song picked at random.
        seedTitle:
          type: string
        seedArtist:
          type: string
        reason:
          type: string
          description: |
            Why the DJ chose it, in a few words: "Because Sam's Radiohead →
            Portishead (similar 0.82)", "A top song by Radiohead, an artist
            the room loves", "Bridging Sam's Radiohead and Jo's Massive
            Attack". Absent for a song a service recommended, or one picked
            at random; say "Like {seedTitle}" then.
        source:
          type: string
          description: The music knowledge the reason came from, for a credit, e.g. "Last.fm, Deezer".

    Palette:
      type: object
      description: |
        The colors of a song's artwork, worked out once on the server so
        every phone in the room matches. On a queue item once it's ready
        (usually soon after it's queued); `/rooms/{roomId}/queue/{itemId}/palette`
        works it out on the spot. Every role is set: when the art has
        nothing that fits one, it's derived from the others.
      required: [accent, dominant, vibrant, muted, dark, light]
      properties:
        accent:
          description: The dominant vivid hue, which tints the app; null for grayscale art.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Accent"
        dominant:
          $ref: "#/components/schemas/OklchColor"
        vibrant:
          $ref: "#/components/schemas/OklchColor"
        muted:
          $ref: "#/components/schemas/OklchColor"
        dark:
          $ref: "#/components/schemas/OklchColor"
        light:
          $ref: "#/components/schemas/OklchColor"

    BeatMap:
      type: object
      description: |
        A song's beat map (MAD-773). Times are in ms from the start of the
        song, on the same clock as the playback position.
      required: [durationMs, bpm, confidence, beats, downbeat, sections, frameRate, bandCount, bands, loudness, features]
      properties:
        durationMs:
          type: integer
          format: int64
        bpm:
          type: number
          description: The tempo; 0 if the song has no steady beat, and then `beats` is empty.
        confidence:
          type: number
          description: How clear the beat is, 0–1.
        beats:
          type: array
          description: The beats.
          items:
            type: integer
            format: int64
        downbeat:
          type: integer
          description: The index in `beats` of the first bar's first beat; every fourth beat after it starts a bar.
        sections:
          type: array
          description: The song's parts (intro, verse, drop), in order; the first starts at 0.
          items:
            $ref: "#/components/schemas/BeatMapSection"
        frameRate:
          type: number
          description: Frames a second in `bands` and `loudness`.
        bandCount:
          type: integer
          description: Spectrum bands per frame in `bands`.
        bands:
          type: string
          format: byte
          description: |
            Base64: each frame's level in each band, low to high, a byte
            (0–255) each, `bandCount` bytes a frame. Each band is scaled to
            its own range in the song.
        loudness:
          type: string
          format: byte
          description: "Base64: each frame's overall level, a byte (0–255) each, scaled to the song."
        features:
          $ref: "#/components/schemas/BeatMapFeatures"

    BeatMapSection:
      type: object
      required: [startMs, energy]
      properties:
        startMs:
          type: integer
          format: int64
        energy:
          type: number
          description: How loud it is next to the rest of the song, 0–1.

    BeatMapFeatures:
      type: object
      description: The song as a whole, 0–1 each, for choosing how it looks.
      required: [energy, brightness, dynamics]
      properties:
        energy:
          type: number
          description: How loud it's mastered, from a quiet acoustic recording to a club track.
        brightness:
          type: number
          description: How much treble there is.
        dynamics:
          type: number
          description: How much its loudness changes.

    Accent:
      type: object
      required: [h, c]
      properties:
        h:
          type: number
          format: double
          description: Hue, in degrees.
        c:
          type: number
          format: double
          description: Chroma, clamped to read well in both themes.

    OklchColor:
      type: object
      description: An OKLCH color, as CSS `oklch(l c h)`.
      required: [l, c, h]
      properties:
        l:
          type: number
          format: double
          description: Lightness, 0-1.
        c:
          type: number
          format: double
          description: Chroma, about 0-0.37.
        h:
          type: number
          format: double
          description: Hue, in degrees.

    PlaysVia:
      type: object
      description: |
        Where the song plays from instead of its own service, which
        couldn't play it: the same recording, found on another service in
        the room. Show "playing from Navidrome instead of Spotify".
      required: [provider, linkId, trackId]
      properties:
        provider:
          type: string
        linkId:
          type: string
        trackId:
          type: string

    PlayedItem:
      type: object
      required: [item, startedAt, endedAt, endReason]
      properties:
        item:
          $ref: "#/components/schemas/QueueItem"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        endReason:
          type: string
          enum: [finished, skipped, removed, error]

    RoomStats:
      type: object
      required: [plays, skipped, listeningMs, topTracks, topArtists, people]
      properties:
        plays:
          type: integer
          description: Songs that played, to the end or until skipped.
        skipped:
          type: integer
        listeningMs:
          type: integer
          format: int64
        topTracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackCount"
        topArtists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistCount"
        people:
          type: array
          description: Everyone whose songs played, most plays first.
          items:
            $ref: "#/components/schemas/PersonStats"
        first:
          $ref: "#/components/schemas/PlayedItem"
        last:
          $ref: "#/components/schemas/PlayedItem"

    PersonStats:
      type: object
      description: One person's songs, whoever skipped them.
      required: [userId, plays, skipped, listeningMs, topTracks, topArtists]
      properties:
        userId:
          type: string
        plays:
          type: integer
        skipped:
          type: integer
        listeningMs:
          type: integer
          format: int64
        topTracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackCount"
        topArtists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistCount"

    TrackCount:
      type: object
      description: A song and how many times it played to the end. `item` is its latest play.
      required: [item, plays]
      properties:
        item:
          $ref: "#/components/schemas/QueueItem"
        plays:
          type: integer

    ArtistCount:
      type: object
      required: [name, plays]
      properties:
        name:
          type: string
        plays:
          type: integer

    ListeningSession:
      type: object
      required: [startedAt, endedAt, plays, people]
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        plays:
          type: integer
        people:
          type: array
          description: User IDs whose songs played, most first.
          items:
            type: string
        night:
          $ref: "#/components/schemas/Night"

    QueuedTrack:
      type: object
      description: The track as it was when queued; still shown if its service is offline.
      required: [provider, trackId, title, artists, durationMs, explicit]
      properties:
        provider:
          type: string
        linkId:
          type: string
          description: Absent if the link was removed; the track can't play then.
        trackId:
          type: string
        title:
          type: string
        artists:
          type: array
          items:
            type: string
        artistIds:
          type: array
          description: |
            The provider's ID for each of `artists`, in the same order, within
            `linkId`. Empty where the provider didn't say.
          items:
            type: string
        album:
          type: string
        albumId:
          type: string
          description: The provider's album ID within `linkId`, if known.
        durationMs:
          type: integer
          format: int64
        explicit:
          type: boolean
        artwork:
          type: string

    NowPlaying:
      type: object
      description: |
        A room's playback, as the server sees it. While `playing`, the
        position is `positionMs` at `at` and advances with the clock.
      required: [roomId, state, positionMs, at, revision]
      properties:
        roomId:
          type: string
        state:
          $ref: "#/components/schemas/PlaybackState"
        item:
          $ref: "#/components/schemas/QueueItem"
        driver:
          type: string
          enum: [stream, remote]
          description: |
            How `item` plays. `stream`: the speaker plays it from
            `/rooms/{roomId}/stream/{itemId}`. `remote`: the song's service
            plays it on its own device, and the speaker just shows it.
        positionMs:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
          description: Server time `positionMs` was true at.
        revision:
          type: integer
          format: int64
          description: |
            Increases whenever the speaker must act: a new song, play,
            pause, or seek. Apply each revision once.
        player:
          $ref: "#/components/schemas/Player"
        next:
          $ref: "#/components/schemas/QueueItem"
        skipVotes:
          $ref: "#/components/schemas/SkipVotes"
        playNow:
          $ref: "#/components/schemas/PlayNowVote"

    PlayNowVote:
      type: object
      description: |
        Someone's request to play a queued song now, in a room whose skip
        permission is `vote`. It passes on the same share of the room as a
        skip, and lapses at `expires`, when the song leaves the queue, or
        when whoever asked takes it back.
      required: [itemId, by, voters, needed, expires]
      properties:
        itemId:
          type: string
        by:
          type: string
          description: Who asked. Their vote is the first.
        voters:
          type: array
          description: IDs of the users who agreed, in order.
          items:
            type: string
        needed:
          type: integer
          description: How many agreeing play the song.
        expires:
          type: string
          format: date-time

    SkipVotes:
      type: object
      description: |
        The vote to skip the playing song, while the room's skip permission
        is `vote`. Everyone in the room but whoever queued the song can
        vote; `needed` changes as people come and go.
      required: [voters, needed]
      properties:
        voters:
          type: array
          description: IDs of the users who voted, in order.
          items:
            type: string
        needed:
          type: integer
          description: How many votes skip the song.

    PlaybackState:
      type: string
      enum: [idle, loading, playing, paused]
      description: |
        `idle`: nothing to play, or no speaker. `loading`: waiting for the
        speaker to start the song.

    Player:
      type: object
      description: The device a room plays through.
      required: [deviceId, userId, name, lastSeen]
      properties:
        deviceId:
          type: string
        userId:
          type: string
        name:
          type: string
        lastSeen:
          type: string
          format: date-time

    PlaybackCommand:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [play, pause, skip, seek, vote_skip, unvote_skip, play_now, vote_play_now, unvote_play_now]
          description: |
            `play_now` plays the queued song `itemId` straight away, skipping
            the one playing. It takes the skip permission; in a room that
            votes on skips, it asks the room instead (`playNow`), and
            `vote_play_now` agrees. `unvote_play_now` takes a vote back, or
            withdraws the request from whoever asked.
        positionMs:
          type: integer
          format: int64
          minimum: 0
          description: Where to seek to.
        itemId:
          type: string
          description: |
            Skip (or vote) only if this is still the current song, so two
            people tapping skip skip one song. For `play_now` and its votes,
            the queued song to play.

    ClaimPlayerRequest:
      type: object
      required: [deviceId, name]
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          description: A stable ID the device makes up and keeps.
        name:
          type: string
          maxLength: 64
          example: Collin's phone

    PlayerReport:
      type: object
      required: [deviceId, itemId, event, positionMs]
      properties:
        deviceId:
          type: string
        itemId:
          type: string
        event:
          type: string
          enum: [playing, progress, paused, ended, error]
        positionMs:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string
          maxLength: 500
          description: What went wrong, for `error`.

    PlaybackNotice:
      type: object
      description: Something members should hear about, like a song skipped because its service failed.
      required: [roomId, message]
      properties:
        roomId:
          type: string
        itemId:
          type: string
        message:
          type: string

    FairnessMode:
      type: string
      enum: [round_robin, fifo]

    PermissionLevel:
      type: string
      enum: [everyone, owner]
      description: Who may do something. The room's owner always may.

    SkipPermission:
      type: string
      enum: [everyone, vote, owner]
      description: |
        Who may skip. `vote`: the owner may, and everyone else votes (see
        SkipVotes). Whoever queued a song may always skip it.

    RoomPermissions:
      type: object
      required: [playPause, seek, skip, speaker]
      properties:
        playPause:
          $ref: "#/components/schemas/PermissionLevel"
        seek:
          $ref: "#/components/schemas/PermissionLevel"
        skip:
          $ref: "#/components/schemas/SkipPermission"
        speaker:
          $ref: "#/components/schemas/PermissionLevel"

    RoomPermissionsChange:
      type: object
      description: Permissions to change. Missing ones stay as they are (`everyone` for a new room).
      properties:
        playPause:
          $ref: "#/components/schemas/PermissionLevel"
        seek:
          $ref: "#/components/schemas/PermissionLevel"
        skip:
          $ref: "#/components/schemas/SkipPermission"
        speaker:
          $ref: "#/components/schemas/PermissionLevel"

    SkipVotePercent:
      type: integer
      minimum: 0
      maximum: 99
      default: 50
      description: |
        A skip vote passes once more than this percent of the room has
        voted (not counting whoever queued the song): 50 is a majority.

    RoomFairness:
      type: object
      description: |
        Tunes the room's fairness mode. While someone else has songs
        waiting, nobody gets more than `maxInARow` songs in a row, and
        `cooldown` other songs play between one person's songs; when
        nobody else is waiting, the music keeps going anyway. In round
        robin, `weights` give some people more songs per turn.
      required: [maxInARow, cooldown, weights, repeatWindowMinutes]
      properties:
        maxInARow:
          type: integer
          minimum: 0
          maximum: 10
          description: 0 is no cap.
        cooldown:
          type: integer
          minimum: 0
          maximum: 10
          description: Songs by others between one person's songs. 0 is none.
        weights:
          type: object
          description: Songs per turn (2 to 4) by user ID, in round robin. Everyone else gets 1.
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 4
        repeatWindowMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: |
            Refuse songs already waiting or playing, or started within this
            many minutes. 0 is off.

    RoomMatching:
      type: object
      description: How the room uses the same song on other services.
      required: [fallback, borrow]
      properties:
        fallback:
          type: boolean
          default: true
          description: |
            When a song's service can't play it, play the same recording
            from another service in the room: a service of someone who's
            here, or a shared one. Matched by ISRC, or carefully by title,
            artist and length.
        borrow:
          type: boolean
          default: false
          description: |
            Anyone may queue a song the room played again, even if it's only
            on someone else's service.

    RoomAutopilot:
      type: object
      description: |
        When the queue runs dry, autopilot adds songs like the ones the
        room has been playing, taking seeds from each member's songs in
        turn. It only plays while the room has a speaker.
      required: [on, adventure]
      properties:
        on:
          type: boolean
          default: false
        adventure:
          type: string
          enum: [similar, discovery]
          default: similar
          description: |
            `similar` stays close to the room's songs, their artists
            included. `discovery` plays other artists, further afield.
            `explore` replaces it: the server keeps it in step, as the
            half `explore` falls in (`discovery` from 50).
        explore:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            How far the DJ strays, from 0 (the room's own artists and their
            hits) to 100 (new artists further afield, deeper cuts). Always
            set in responses. In a request it decides; left out, it's 25
            for `similar` and 75 for `discovery`.
        energyCurve:
          type: boolean
          default: true
          description: |
            Shapes the DJ's set to how long the room has been going and the
            time of day: a gentle rise in energy, then settling. Always set
            in responses; left out of a request, it's on.

    RoomVisibility:
      type: string
      enum: [open, unlisted, private]
      description: |
        Who can see and join the room. `open`: everyone on the server.
        `unlisted`: its members, and anyone with one of its invite links,
        which any member can share. `private`: the members its owner lets
        in. The owner is always in.

    RoomMember:
      type: object
      required: [user, status, joinedAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        status:
          type: string
          enum: [member, pending]
          description: "`pending`: asked to join, and not let in yet."
        addedBy:
          type: string
          description: Who let them in, if someone did (not an invite).
        joinedAt:
          type: string
          format: date-time
          description: When they joined, or asked to.

    RoomInvite:
      type: object
      required: [code, roomId, url, createdAt, uses]
      properties:
        code:
          type: string
        roomId:
          type: string
        url:
          type: string
          description: The link to share.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Absent if it works until revoked.
        maxUses:
          type: integer
          description: How many people it lets in. Absent for any number.
        uses:
          type: integer

    CreateRoomInviteRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Up to 90 days from now. Absent works until revoked.
        maxUses:
          type: integer
          minimum: 0
          maximum: 1000
          description: How many people it lets in. 0 or absent for any number.

    RoomInvitePreview:
      type: object
      required: [roomId, roomName, ownerId, visibility, approval, status]
      properties:
        roomId:
          type: string
        roomName:
          type: string
        ownerId:
          type: string
        visibility:
          $ref: "#/components/schemas/RoomVisibility"
        approval:
          type: boolean
          description: Using it asks the owner to let you in.
        status:
          type: string
          enum: [none, pending, member]
          description: "`member` includes owning the room."

    RoomInviteResult:
      type: object
      required: [status, room]
      properties:
        status:
          type: string
          enum: [member, pending]
        room:
          $ref: "#/components/schemas/RoomInvitePreview"

    RoomMembersChanged:
      type: object
      required: [roomId, userId, change]
      properties:
        roomId:
          type: string
        userId:
          type: string
        change:
          type: string
          enum: [joined, requested, removed]

    Room:
      type: object
      required: [id, name, ownerId, visibility, approveJoins, fairnessMode, fairness, matching, autopilot, guests, screens, permissions, skipVotePercent, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        ownerId:
          type: string
        visibility:
          $ref: "#/components/schemas/RoomVisibility"
        approveJoins:
          type: boolean
          description: While private, someone using an invite asks to join, and the owner lets them in.
        fairnessMode:
          $ref: "#/components/schemas/FairnessMode"
        fairness:
          $ref: "#/components/schemas/RoomFairness"
        matching:
          $ref: "#/components/schemas/RoomMatching"
        autopilot:
          $ref: "#/components/schemas/RoomAutopilot"
        guests:
          $ref: "#/components/schemas/RoomGuests"
        screens:
          $ref: "#/components/schemas/RoomScreens"
        permissions:
          $ref: "#/components/schemas/RoomPermissions"
        skipVotePercent:
          $ref: "#/components/schemas/SkipVotePercent"
        createdAt:
          type: string
          format: date-time

    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        visibility:
          $ref: "#/components/schemas/RoomVisibility"
        approveJoins:
          type: boolean
        fairnessMode:
          $ref: "#/components/schemas/FairnessMode"
        fairness:
          $ref: "#/components/schemas/RoomFairness"
        matching:
          $ref: "#/components/schemas/RoomMatching"
        autopilot:
          $ref: "#/components/schemas/RoomAutopilot"
        guests:
          $ref: "#/components/schemas/RoomGuests"
        screens:
          $ref: "#/components/schemas/RoomScreens"
        permissions:
          $ref: "#/components/schemas/RoomPermissionsChange"
        skipVotePercent:
          $ref: "#/components/schemas/SkipVotePercent"

    UpdateRoomRequest:
