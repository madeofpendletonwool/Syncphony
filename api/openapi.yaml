openapi: 3.0.3
info:
  title: Syncphony API
  version: 0.1.0
  description: |
    Shared, fair music queue across streaming services.
    This file is the source of truth for the HTTP API. Go server types and the
    web client's TypeScript types are generated from it (`make gen`).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and build info
      tags: [system]
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  # --- Signup and sign-in ---------------------------------------------------

  /invites/{code}:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: getInvite
      summary: Check an invite before signing up
      description: Returns 404 if the invite doesn't exist, was used, or expired.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The invite can be used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteInvite
      summary: Revoke an invite (admin)
      tags: [admin]
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"

  /auth/signup:
    post:
      operationId: signup
      summary: Create an account with an invite and a password
      description: Signs the new user in.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/signup/passkey/begin:
    post:
      operationId: beginPasskeySignup
      summary: Start creating an account with an invite and a passkey
      description: |
        Returns WebAuthn creation options for `navigator.credentials.create`.
        The account is created when the ceremony finishes.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeySignupRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /auth/signup/passkey/finish:
    post:
      operationId: finishPasskeySignup
      summary: Finish creating an account with a passkey
      description: Signs the new user in.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCeremony"
      responses:
        "201":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Sign in with a username and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/passkey/begin:
    post:
      operationId: beginPasskeyLogin
      summary: Start signing in with a passkey
      description: Returns WebAuthn request options for `navigator.credentials.get`. No username needed.
      tags: [auth]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /auth/passkey/finish:
    post:
      operationId: finishPasskeyLogin
      summary: Finish signing in with a passkey
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCeremony"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out this session
      tags: [auth]
      security: []
      responses:
        "204":
          description: Signed out; the session cookie is cleared
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  # --- Account recovery -----------------------------------------------------

  /reset-links/{code}:
    parameters:
      - $ref: "#/components/parameters/ResetCode"
    get:
      operationId: getResetLink
      summary: Check a reset link before using it
      description: Returns 404 if the link doesn't exist, was used, or expired.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The link can be used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetLinkInfo"
        default:
          $ref: "#/components/responses/Error"

  /reset-links/{code}/password:
    parameters:
      - $ref: "#/components/parameters/ResetCode"
    post:
      operationId: resetPassword
      summary: Set a new password with a reset link
      description: |
        Uses up the link, signs the user out everywhere, and signs them in
        here.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /reset-links/{code}/passkey/begin:
    parameters:
      - $ref: "#/components/parameters/ResetCode"
    post:
      operationId: beginResetPasskey
      summary: Start adding a passkey with a reset link
      tags: [auth]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /reset-links/{code}/passkey/finish:
    parameters:
      - $ref: "#/components/parameters/ResetCode"
    post:
      operationId: finishResetPasskey
      summary: Finish adding a passkey with a reset link
      description: |
        Saves the passkey, uses up the link, signs the user out everywhere,
        and signs them in here.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCeremony"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  # --- The signed-in user ---------------------------------------------------

  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [account]
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Update your profile
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"

  /me/password:
    put:
      operationId: setPassword
      summary: Set or change your password
      description: |
        `currentPassword` is required if you already have one. Other sessions
        are signed out unless `signOutOtherSessions` is false.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          description: Password set
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePassword
      summary: Remove your password (passkey-only sign-in)
      description: Fails with 409 if you have no passkey.
      tags: [account]
      responses:
        "204":
          description: Password removed
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys:
    get:
      operationId: listPasskeys
      summary: Your passkeys
      tags: [account]
      responses:
        "200":
          description: Passkeys, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Passkey"
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys/begin:
    post:
      operationId: beginAddPasskey
      summary: Start adding a passkey
      tags: [account]
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys/finish:
    post:
      operationId: finishAddPasskey
      summary: Finish adding a passkey
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCeremony"
      responses:
        "201":
          description: The new passkey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Credential ID, base64url
        schema:
          type: string
    patch:
      operationId: renamePasskey
      summary: Rename a passkey
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "204":
          description: Renamed
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePasskey
      summary: Remove a passkey
      description: Fails with 409 if it's your only way to sign in.
      tags: [account]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /me/avatar:
    put:
      operationId: uploadAvatar
      summary: Upload a profile picture
      description: |
        JPEG, PNG, GIF or WebP, up to 10 MB. It's cropped to a centered
        square and shrunk; `avatar` then points at `/api/users/{id}/avatar`.
        Remove it with `PATCH /me` and an empty `avatar`.
      tags: [account]
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"

  /me/reauth/begin:
    post:
      operationId: beginReauth
      summary: Start confirming it's you with a passkey
      description: |
        For something that can't be undone, like deleting your account.
        Finish by sending the ceremony with that request.
      tags: [account]
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /me/delete:
    post:
      operationId: deleteMe
      summary: Delete your account
      description: |
        Confirm it's you with `password`, or with `ceremonyId` and
        `credential` from `/me/reauth/begin`. Signs you out everywhere and
        deletes your sign-in methods, linked services (and their
        credentials), and picture; your queued songs are dropped. The rooms
        you own go to the longest-standing admin. Rooms' history keeps your
        songs, under "Former member". The last admin who can sign in can't
        leave (409 `last_admin`).
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMeRequest"
      responses:
        "204":
          description: Deleted; the session cookie is cleared
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /me/sessions:
    get:
      operationId: listMySessions
      summary: The devices you're signed in on
      tags: [account]
      responses:
        "200":
          description: Sessions, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignedInSession"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeOtherSessions
      summary: Sign out everywhere else
      description: Signs out every session but this one.
      tags: [account]
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"

  /me/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeMySession
      summary: Sign out one device
      tags: [account]
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"

  # --- The server -----------------------------------------------------------

  /server-settings:
    get:
      operationId: getServerSettings
      summary: The server's own settings
      tags: [server]
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateServerSettings
      summary: Change the server's settings (admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerSettingsUpdate"
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        default:
          $ref: "#/components/responses/Error"

  /admin/server:
    get:
      operationId: getServerInfo
      summary: The server's version, uptime, database and backups (admin)
      tags: [admin]
      responses:
        "200":
          description: The server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        default:
          $ref: "#/components/responses/Error"

  /admin/backups:
    post:
      operationId: createBackup
      summary: Back up the database now (admin)
      description: |
        Writes a copy of the database to the server's backup directory and
        keeps the newest 7. Linked services' credentials stay sealed in it:
        restoring needs the same vault key.
      tags: [admin]
      responses:
        "201":
          description: The new backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        default:
          $ref: "#/components/responses/Error"

  /admin/links:
    get:
      operationId: listAllLinks
      summary: Every linked service on the server, and its health (admin)
      tags: [admin]
      responses:
        "200":
          description: Links, failing ones first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"

  /admin/rooms:
    get:
      operationId: listActiveRooms
      summary: Every room, who's in it, and what it's playing through (admin)
      tags: [admin]
      responses:
        "200":
          description: Rooms, busiest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomActivity"
        default:
          $ref: "#/components/responses/Error"

  /admin/rooms/{roomId}/taste:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getRoomTaste
      summary: What the DJ has learned of a room's taste (admin)
      description: |
        Tonight's taste, read from the room's latest plays, and its taste
        over past nights, a weak prior on the DJ's picks (ADR 0012), to
        check that the learning makes sense. Like what a room is playing,
        it's the room's own business: a room you can't open isn't found.
      tags: [admin]
      responses:
        "200":
          description: The room's taste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomTaste"
        default:
          $ref: "#/components/responses/Error"

  /admin/sessions:
    get:
      operationId: listAllSessions
      summary: Everyone's signed-in devices (admin)
      description: Guests' sessions aren't included.
      tags: [admin]
      responses:
        "200":
          description: Sessions, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSession"
        default:
          $ref: "#/components/responses/Error"

  /admin/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeSession
      summary: Sign out anyone's device (admin)
      tags: [admin]
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"

  # --- People and invites ---------------------------------------------------

  /users:
    get:
      operationId: listUsers
      summary: Everyone on this server
      tags: [account]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: Users, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateUser
      summary: Change someone's role, or disable their account (admin)
      description: |
        A disabled account is signed out everywhere and can't sign in, but
        keeps its history, services and rooms. There's always at least one
        admin who can sign in: demoting or disabling the last fails with
        409 `last_admin`. You can't disable yourself. Guests can't be
        managed here; remove them from their room.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeUser
      summary: Remove someone's account (admin)
      description: |
        Like deleting your own account (`/me/delete`), for someone else:
        their rooms become yours. Not for yourself, or the last admin who
        can sign in.
      tags: [admin]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /user-audit:
    get:
      operationId: listUserAudit
      summary: Who changed whose account, and when (admin)
      tags: [admin]
      responses:
        "200":
          description: The newest 100 changes, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAuditEntry"
        default:
          $ref: "#/components/responses/Error"

  /users/{id}/avatar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUserAvatar
      summary: Someone's uploaded profile picture
      description: What `avatar` points at after an upload. Cacheable; the URL changes with the picture.
      tags: [account]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The picture
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

  /users/{id}/reset-link:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createResetLink
      summary: Make a one-time reset link for someone (admin)
      description: |
        For someone who can't sign in. Replaces any reset link they had.
        The link is only returned now: the server keeps just its hash.
      tags: [admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResetLinkRequest"
      responses:
        "201":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetLink"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeResetLink
      summary: Cancel someone's reset link (admin)
      tags: [admin]
      responses:
        "204":
          description: Cancelled
        default:
          $ref: "#/components/responses/Error"

  /reset-links:
    get:
      operationId: listResetLinks
      summary: Reset links waiting to be used (admin)
      tags: [admin]
      responses:
        "200":
          description: Unused, unexpired links, newest first. Without URLs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResetLink"
        default:
          $ref: "#/components/responses/Error"

  /invites:
    get:
      operationId: listInvites
      summary: All invites (admin)
      tags: [admin]
      responses:
        "200":
          description: Invites, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvite
      summary: Create an invite link (admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The new invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"

  # --- Linked services ------------------------------------------------------

  /providers:
    get:
      operationId: listProviders
      summary: Services that can be linked
      tags: [links]
      responses:
        "200":
          description: Providers, in registration order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderInfo"
        default:
          $ref: "#/components/responses/Error"

  /links:
    get:
      operationId: listLinks
      summary: Your linked service accounts
      description: Credentials are never returned.
      tags: [links]
      parameters:
        - name: include
          in: query
          description: "`shared`: also list links others have shared, after yours."
          schema:
            type: string
            enum: [shared]
      responses:
        "200":
          description: Links, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLink
      summary: Link an account with a form (credentials providers)
      description: |
        Validates the fields with the service. Linking an account you've
        already linked updates that link.
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: relink
      summary: Re-link with new credentials (credentials providers)
      description: Must be the same account. Clears `needs_relink`.
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelinkRequest"
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateLink
      summary: Share a link with everyone, or stop sharing it
      description: |
        Only services whose `shareable` capability is set can be shared
        (`not_shareable` otherwise). Songs already queued from a link keep
        playing after it's unshared.
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLinkRequest"
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlink
      summary: Unlink and delete the stored credentials
      description: Queued tracks from this link stay in the queue but can't play.
      tags: [links]
      responses:
        "204":
          description: Unlinked
        default:
          $ref: "#/components/responses/Error"

  /pairings:
    post:
      operationId: beginPairing
      summary: Start linking (or re-linking) by device pairing
      description: |
        For providers with `pairing` set. Show `userCode` and `verifyUrl`:
        the user opens the URL on any device and approves the code. Then poll
        `GET /pairings/{id}` every `interval` seconds until it's
        approved (`oauth2` providers continue with `POST /links/oauth` and
        `pairingId`) or linked (`device` providers).
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginPairingRequest"
      responses:
        "200":
          description: The pairing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pairing"
        default:
          $ref: "#/components/responses/Error"

  /pairings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: pollPairing
      summary: Whether a device pairing was approved
      description: |
        Asks the service at most once per `interval`. An expired, finished or
        unknown pairing is `pairing_expired`; a declined one is
        `service_rejected_credentials`.
      tags: [links]
      responses:
        "200":
          description: The pairing's status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingStatus"
        default:
          $ref: "#/components/responses/Error"

  /links/oauth:
    post:
      operationId: beginOAuthLink
      summary: Start linking (or re-linking) an OAuth2 provider
      description: |
        Send the browser to `authUrl`. The service redirects back to
        `/api/links/oauth/callback`, which lands on the web app's
        `/settings/services` page. Providers with `pairing` set need their
        approved pairing first (`not_paired` otherwise).
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginOAuthLinkRequest"
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required: [authUrl]
                properties:
                  authUrl:
                    type: string
        default:
          $ref: "#/components/responses/Error"

  /links/oauth/callback:
    get:
      operationId: completeOAuthLink
      summary: OAuth2 redirect target (browser navigation)
      description: |
        Finishes linking and redirects to `/settings/services?linked=<link id>`,
        or `/settings/services?link_error=<error code>` on failure. Needs the
        session cookie, but always redirects rather than returning an error.
      tags: [links]
      security: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the service when the user declined.
          schema:
            type: string
      responses:
        "303":
          description: Back to the web app
          headers:
            Location:
              schema:
                type: string

  # --- Browsing your services ----------------------------------------------

  /search:
    get:
      operationId: search
      summary: Search every service you've linked, and shared ones
      description: |
        Searches each of your links, and every link someone has shared, at
        once for tracks, albums, artists and playlists.
        Playlists are the link's own (the ones it lists) whose names hold
        every word searched for. With `publicPlaylists`, services that can
        search everyone's playlists (Spotify) add matching public ones too.
        Each link's results come back as a group, in link order. A link that
        fails (offline, needs re-linking, too slow) gets a group with
        `error` set instead of failing the whole search.
      tags: [browse]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          description: Most results per kind, per link.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: publicPlaylists
          in: query
          description: Also search public playlists, where the service can.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Results, one group per link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/albums/{albumId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: albumId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAlbum
      summary: An album and its tracks, through one of your links or a shared one
      tags: [browse]
      responses:
        "200":
          description: The album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDetail"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/tracks/{trackId}/lyrics:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: trackId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTrackLyrics
      summary: A track's lyrics, through one of your links or a shared one
      description: |
        From the track's own service when it has them (Navidrome reads
        embedded tags and `.lrc` files), and otherwise from LRCLIB. Results,
        and misses, are cached. 404 if none are found.
      tags: [browse]
      responses:
        "200":
          description: The lyrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lyrics"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/artists/{artistId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: artistId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getArtist
      summary: An artist and their albums, through one of your links or a shared one
      tags: [browse]
      responses:
        "200":
          description: The artist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistDetail"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/artists/{artistId}/about:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: artistId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getArtistAbout
      summary: What's known about an artist
      description: |
        Their bio from Wikipedia, facts, members and genres, from
        MusicBrainz and the music knowledge layer, and the kind of each of
        their albums the service doesn't say. Parts nobody knows are left
        empty. The first time, it can take several seconds; then it's cached.
      tags: [browse]
      responses:
        "200":
          description: What's known about an artist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistAbout"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/artists/{artistId}/tracks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: artistId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getArtistTracks
      summary: An artist's top songs and appearances
      description: |
        Their most popular songs, from what's known about music and else
        the service, matched onto this link, and songs on others' records
        they're credited on.
      tags: [browse]
      responses:
        "200":
          description: An artist's top songs and appearances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistTracks"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/artists/{artistId}/related:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: artistId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getArtistRelated
      summary: Artists like an artist, and songs by them
      description: |
        Similar artists, most alike first, with `artist` set for those on
        this link, and a few songs by each that are.
      tags: [browse]
      responses:
        "200":
          description: Artists like an artist, and songs by them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedMusic"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/artists/{artistId}/elsewhere:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: artistId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getArtistElsewhere
      summary: The same artist on your other services
      description: |
        The artist, by name, on the other links you may use.
      tags: [browse]
      responses:
        "200":
          description: The same artist on your other services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtistElsewhere"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/artists/{artistId}/shuffle:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: artistId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getArtistShuffle
      summary: Songs by an artist at random
      description: |
        Picked from across their albums.
      tags: [browse]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Songs by an artist at random
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackResult"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/albums/{albumId}/about:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: albumId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAlbumAbout
      summary: What's known about an album
      description: |
        Its kind, first release, labels and genres from MusicBrainz, and a
        summary from Wikipedia. 404 if MusicBrainz doesn't know it, or is off.
      tags: [browse]
      responses:
        "200":
          description: What's known about the album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumAbout"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/genre:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getGenre
      summary: A genre's artists, and songs by them
      description: |
        Its top artists, those on this link first, with a few songs by
        each. 404 if nothing is known about it.
      tags: [browse]
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The genre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreDetail"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/playlists:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listPlaylists
      summary: The playlists of one of your links or a shared one
      description: >-
        In the service's order. `not_found` if the service has no playlists
        (its `capabilities.playlists` is false).
      tags: [browse]
      parameters:
        - name: cursor
          in: query
          description: The previous page's `next`.
          schema:
            type: string
      responses:
        "200":
          description: A page of playlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistList"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/playlists/{playlistId}/tracks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: playlistId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPlaylistTracks
      summary: A page of a playlist's tracks, through one of your links or a shared one
      description: >-
        In playlist order. A page can be short, or even empty, when the
        playlist holds things that can't be queued (podcast episodes, local
        files); keep going while there's a `next`.
      tags: [browse]
      parameters:
        - name: cursor
          in: query
          description: The previous page's `next`.
          schema:
            type: string
      responses:
        "200":
          description: A page of tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistTracks"
        default:
          $ref: "#/components/responses/Error"

  /random-tracks:
    get:
      operationId: getRandomTracks
      summary: Songs picked at random from services you can use
      description: |
        For "surprise me": songs from your links and shared ones whose
        service can pick at random, mixed together.
      tags: [browse]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        "200":
          description: Random songs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackList"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/collection:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCollection
      summary: Shortcuts into the library of one of your links or a shared one
      description: >-
        Saved albums and artists, and albums recently added, played most,
        and played lately, for something to pick before searching. Saved
        songs are a playlist instead. A list the service can't make is
        empty. `not_found` if the service has none of this (its
        `capabilities.collection` is false).
      tags: [browse]
      responses:
        "200":
          description: The link's collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkCollection"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/artwork:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLinkArtwork
      summary: An image from one of your links or a shared one
      description: For `artwork` refs in search and browse results. Cacheable.
      tags: [browse]
      parameters:
        - name: ref
          in: query
          required: true
          schema:
            type: string
        - name: size
          in: query
          description: Wanted width in pixels; a hint.
          schema:
            type: integer
            minimum: 0
            maximum: 2048
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getQueue
      summary: The room's queue and its fair play order
      description: The same snapshot `queue.updated` pushes over the room WebSocket.
      tags: [queue]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addToQueue
      summary: Add songs to the end of your lane
      description: |
        Each song is looked up on its service through one of your links, and
        its metadata is kept with the queue item. All are added, in order, or
        none are. When you add one song, services that can tell ahead of time
        that they won't play it (Spotify) are asked first, and the song is
        refused with `not_playable` and a message to show.

        If the room has a repeat window (`fairness.repeatWindowMinutes`),
        songs already waiting or playing, or started within the window, are
        left out, matched by track or by ISRC across services. If that
        leaves nothing, the add is refused with `repeat` (409) and a
        message to show.

        With `warnDuplicates`, songs the room already has (waiting,
        playing, or started in the last three hours) refuse the add with
        `duplicate` (409), listing each copy so the app can say where it is
        and offer "add anyway": the same request without `warnDuplicates`.
        Songs match by track, ISRC or MusicBrainz recording across
        services, or carefully by title, artist and length.
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToQueueRequest"
      responses:
        "200":
          description: The queue after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
        "409":
          description: |
            Refused: `duplicate` (see `duplicates`), `repeat`, or
            `guest_limit`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddToQueueConflict"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/restore:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: restoreQueueItems
      summary: Undo removing songs
      description: |
        Puts songs removed in the last minute back in the queue, each where
        it was in its lane. Only whoever removed a song, or the room's owner,
        can restore it. All are restored, or none: a song that wasn't
        removed, or was removed too long ago, is refused with
        `undo_expired` (409).
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreQueueItemsRequest"
      responses:
        "200":
          description: The queue after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/lane:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    delete:
      operationId: clearLane
      summary: Remove all your waiting songs
      description: |
        Your playing song plays on. The songs removed can be put back with
        `POST /rooms/{roomId}/queue/restore` for a minute.
      tags: [queue]
      responses:
        "200":
          description: The queue after the change, and what was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearedLane"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/stats:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getRoomStats
      summary: Who played what, and the top tracks and artists
      description: |
        Sums up the songs that started in `[from, to)`, by default all of
        them. A session's recap is its stats: pass its `startedAt` and
        `endedAt` (plus a moment). Songs that failed or were removed don't
        count. Top tracks and artists count songs that played to the end.
      tags: [history]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStats"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/sessions:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: listSessions
      summary: The room's listening sessions, newest first
      description: |
        A session is a stretch of listening: a new one starts when the
        room has been quiet for two hours.
      tags: [history]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListeningSession"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/artist-plays:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getRoomArtistPlays
      summary: An artist's songs the room played most
      description: |
        Songs credited to the artist, by name, that played to the end in
        this room, most plays first.
      tags: [history]
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: The artist's most played songs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackCount"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/history:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getHistory
      summary: Songs the room played, newest first
      description: |
        Songs that finished, were skipped or failed. The song playing now
        isn't included until it ends. Refetch on `nowplaying.updated` when
        the song changes. For the next page, pass the last item's
        `startedAt` as `before`.
      tags: [history]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: before
          in: query
          description: Only plays that started before this time.
          schema:
            type: string
            format: date-time
        - name: userId
          in: query
          description: Only this person's songs.
          schema:
            type: string
      responses:
        "200":
          description: Recent plays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayedItem"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/suggestions:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getSuggestions
      summary: Songs to keep the room's vibe going
      description: |
        Songs like the ones the room has played through and has queued or
        playing now, from links you can add from. `mine` is like your own
        songs; `group` is like everyone's, members taking turns. Songs
        waiting, playing or recently played aren't suggested, nor are
        autopilot's, nor songs by an artist the room skipped a song of
        without ever finishing or queuing one of theirs.
        `source=queue` reads the vibe from what's playing and waiting
        instead, so a queued change of vibe is reflected; what played
        through stands in when nothing's queued.
        Services that recommend (Navidrome) give similar songs; ones that
        only search (Spotify) give more by the seed's artist. The list is
        empty when the room has nothing to go on yet.
        A list is reused for a couple of minutes while the queue doesn't
        change; pass `refresh` for a new shuffle.
      tags: [browse]
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, group]
            default: mine
        - name: source
          in: query
          description: Where the vibe is read from, what's played through
            and playing, or what's queued.
          schema:
            type: string
            enum: [history, queue]
            default: history
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: refresh
          in: query
          description: Build a new list instead of reusing the last one.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Suggestions, best first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestions"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/{itemId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: moveQueueItem
      summary: Move one of your queued songs within your lane
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveQueueItemRequest"
      responses:
        "200":
          description: The queue after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeQueueItem
      summary: Remove a queued song
      description: |
        Your own songs, or anyone's if you own the room. The playing song
        can't be removed (`not_queued`); skip it instead.
      tags: [queue]
      responses:
        "200":
          description: The queue after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/{itemId}/similar:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getQueueItemSimilar
      summary: Songs like one the room queued, from services you can use
      description: |
        For "more like what's playing". Asks each of your links and the
        shared ones whose service recommends (Navidrome through Last.fm,
        say), finding the song there first if it came from elsewhere.
        Most alike first, taking turns between services. Empty when no
        service knows anything similar.
      tags: [browse]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Similar songs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackList"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/{itemId}/artwork:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getQueueItemArtwork
      summary: A queued song's artwork
      description: |
        Loaded through the link of whoever queued the song, so everyone in
        the room can see it. When that's missing, or smaller than `size`,
        the release's front cover from the Cover Art Archive is sent instead
        if it's bigger, once the song has been matched on MusicBrainz. 404
        if there's none.
      tags: [queue]
      parameters:
        - name: size
          in: query
          description: Wanted width in pixels; a hint.
          schema:
            type: integer
            minimum: 0
            maximum: 2048
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/{itemId}/palette:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getQueueItemPalette
      summary: A queued song's artwork colors
      description: |
        The palette `palette` on the queue item will carry, worked out now
        if it isn't yet. 404 if the song has no artwork the server can read
        (an SVG, say); the client can fall back to the image itself.
      tags: [queue]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The palette
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Palette"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/{itemId}/beatmap:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getQueueItemBeatMap
      summary: A queued song's beat map
      description: |
        The song's tempo, beats, bars and sections, and its spectrum from
        moment to moment, for visuals that move with the music on every
        screen in the room. Worked out from the audio once, usually soon
        after the song is queued; if it hasn't been yet, it's worked out
        now, which can take a few seconds. 404 `no_beat_map` if the song
        can't have one (its service has no audio, or it couldn't be
        decoded).
      tags: [queue]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The beat map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatMap"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/{itemId}/lyrics:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getQueueItemLyrics
      summary: A queued song's lyrics
      description: |
        Like `/links/{id}/tracks/{trackId}/lyrics`, but through the link of
        whoever queued the song, so everyone in the room can read along.
        If that link is gone, LRCLIB is still asked. 404 if none are found.
      tags: [queue]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The lyrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lyrics"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/{itemId}/liner-notes:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getQueueItemLinerNotes
      summary: A queued song's liner notes
      description: |
        The release, credits and a few facts from MusicBrainz, and the
        artist's bio from Wikipedia. The first ask for a song can take a
        few seconds (MusicBrainz allows a request a second); after that
        they're cached. 404 if MusicBrainz doesn't know the song, or
        MusicBrainz is turned off.
      tags: [queue]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The liner notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinerNotes"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/reactions:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: sendReaction
      summary: Send an emoji reaction to the room
      description: |
        Floats up on the room's big screen, and reaches everyone on the room
        socket as `reaction.sent`. Reactions aren't kept. Limited to a few a
        second per person (`rate_limited`).
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionRequest"
      responses:
        "202":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/displays:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: listDisplays
      summary: The room's paired displays
      tags: [displays]
      responses:
        "200":
          description: Displays, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Display"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: pairDisplay
      summary: Pair a display with the room
      description: |
        Type in the code a display (a TV at `/tv`) is showing. It then shows
        this room's big screen until it's unpaired. With `audio`, it may
        also play the room's audio (see `updateDisplay`). `pairing_invalid`
        if no display is showing the code; wrong codes are rate limited.
      tags: [displays]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairDisplayRequest"
      responses:
        "201":
          description: Paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/displays/{displayId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: displayId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: unpairDisplay
      summary: Unpair a display
      description: The room's owner, whoever paired it, or an admin.
      tags: [displays]
      responses:
        "204":
          description: Unpaired; the display goes back to showing a code
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDisplay
      summary: Turn a display's audio on or off
      description: |
        With `audio` on, the display may become the room's speaker, acting
        for whoever paired it (so it needs their `speaker` permission).
        Turning it off while it's the speaker stops it, and the room
        pauses. The room's owner, whoever paired it, or an admin.
      tags: [displays]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDisplayRequest"
      responses:
        "200":
          description: The display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
        default:
          $ref: "#/components/responses/Error"

  /display/pairing:
    post:
      operationId: beginDisplayPairing
      summary: Start pairing this device as a display
      description: |
        Returns a short code for the display to show, and sets a pairing
        cookie. Poll `GET /display/pairing` until someone in a room types the
        code in. Codes last 10 minutes.
      tags: [displays]
      security: []
      responses:
        "201":
          description: A code to show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayPairing"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: pollDisplayPairing
      summary: Check whether this display has been paired
      description: |
        Reads the pairing cookie. Once paired, sets the display cookie and
        returns the room. `pairing_expired` (410) when the code timed out:
        start again.
      tags: [displays]
      security: []
      responses:
        "200":
          description: The pairing's status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayPairingStatus"
        default:
          $ref: "#/components/responses/Error"

  /display:
    get:
      operationId: getDisplay
      summary: This display, and its room
      description: Reads the display cookie. `unauthenticated` (401) if this device isn't a paired display.
      tags: [displays]
      security: []
      responses:
        "200":
          description: The display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayMe"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: leaveDisplay
      summary: Unpair this display, from the display
      tags: [displays]
      security: []
      responses:
        "204":
          description: Unpaired; the display cookie is cleared
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/{itemId}/hearts:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getHearts
      summary: Who hearted a song
      tags: [nights]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The song's hearts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hearts"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: heartSong
      summary: Heart a song
      description: |
        A heart toward the song of the night. It isn't a vote to skip.
        Only the playing song, or one that played earlier tonight
        (`not_tonight`, 409, otherwise). You can't heart your own song
        (`invalid_input`), and in rooms where guests can't vote, guests
        can't heart (`forbidden`). Everyone in the room gets
        `hearts.updated`.
      tags: [nights]
      responses:
        "200":
          description: The song's hearts, yours included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hearts"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unheartSong
      summary: Take back a heart
      tags: [nights]
      responses:
        "200":
          description: The song's hearts, without yours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hearts"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/nights:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: listNights
      summary: The room's past nights, and their songs of the night
      tags: [nights]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Nights, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Night"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: endNight
      summary: End the night, and crown its song
      description: |
        The room's owner or an admin wraps up the night. The most-hearted
        song since the night began is crowned song of the night, and
        everyone in the room (the big screen too) gets `night.ended`.
        Nights also end on their own once the room has been quiet for two
        hours, the same gap that separates listening sessions.
        `nothing_played` (409) if nothing has played since the last night
        ended.
      tags: [nights]
      responses:
        "201":
          description: The night that ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Night"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/guest-pass:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getGuestPass
      summary: The room's guest pass, to show as a QR code
      description: |
        The pass guests scan to join without an account. `not_found` (404)
        when the room has none that's still good. Guests can't see it.
      tags: [guests]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The room's current guest pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPass"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createGuestPass
      summary: Start a new guest pass
      description: |
        Any member, in a room that allows guests (`guests_off`, 403,
        otherwise). It replaces the room's current pass, whose code stops
        working; guests who joined with it stay. Everyone in the room gets
        `guests.updated`.
      tags: [guests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestPassRequest"
      responses:
        "201":
          description: The new pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPass"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeGuestPass
      summary: Revoke the room's guest pass
      description: |
        No one else can join with it. Guests already in stay until they
        expire or are removed. The room's owner, an admin, or whoever
        started the pass.
      tags: [guests]
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/guests:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: listGuests
      summary: The room's guests
      tags: [guests]
      responses:
        "200":
          description: Guests still in the room, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/guests/{userId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: kickGuest
      summary: Remove a guest
      description: |
        Signs the guest out and takes their waiting songs out of the
        queue. Songs they already played stay in the room's history and
        recaps. The room's owner or an admin.
      tags: [guests]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /guest/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getGuestInvite
      summary: Check a guest pass before joining
      description: |
        `guest_pass_invalid` (404) if it's wrong, expired or revoked, or
        the room no longer allows guests. Wrong passes are rate limited by IP.
      tags: [guests]
      security: []
      responses:
        "200":
          description: The room the pass joins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestInvite"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: joinAsGuest
      summary: Join a room as a guest
      description: |
        Makes a guest account and signs it in until the pass expires. A
        guest has no password, passkey, services or settings. They can
        search the server's shared services, add songs to their own lane
        (up to the room's limit; `guest_limit`, 409, past it), react, and
        vote and heart if the room allows it, in this room only. When they
        expire or are removed, their waiting songs leave the queue; what
        they played stays in the room's history under their name.
      tags: [guests]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinAsGuestRequest"
      responses:
        "201":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /rooms:
    get:
      operationId: listRooms
      summary: The rooms you can open
      description: |
        Open rooms, rooms you own, and rooms you're a member of. Admins see
        the rest on the server page (`/admin/rooms`). A guest sees only
        their own room.
      tags: [rooms]
      responses:
        "200":
          description: Rooms, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRoom
      summary: Create a room you own
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: The new room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getRoom
      summary: A room
      tags: [rooms]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateRoom
      summary: Change a room (owner or admin)
      description: |
        Everyone in the room gets `room.updated`. A new fairness mode or
        `fairness` reorders the queue at once; `fairness` replaces the
        room's as a whole.
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
      responses:
        "200":
          description: The room after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRoom
      summary: Delete a room (owner or admin)
      description: |
        Its queue, history, nights, displays and guests go with it. Everyone
        in the room gets `room.deleted`.
      tags: [rooms]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/owner:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    put:
      operationId: transferRoom
      summary: Give a room to someone else (owner or admin)
      description: |
        The new owner must be a member who can sign in. The old owner
        stays in the room as a member. Everyone in the room gets
        `room.updated`.
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRoomRequest"
      responses:
        "200":
          description: The room, with its new owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/members:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: listRoomMembers
      summary: Who's a member of the room
      description: |
        For a room that isn't open: its members, oldest first, not counting
        the owner (always in). The owner and admins also see who's asked to
        join (`status: pending`). An open room has no members list; anyone
        on the server can join it.
      tags: [rooms]
      responses:
        "200":
          description: Members, and requests to join
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomMember"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: addRoomMember
      summary: Let someone into the room (owner or admin)
      description: |
        Adds a member of the server to a room that isn't open, or lets in
        someone who asked to join. Everyone in the room gets
        `members.updated`.
      tags: [rooms]
      responses:
        "204":
          description: They're a member
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeRoomMember
      summary: Remove someone from the room, or leave it
      description: |
        The owner or an admin may remove anyone but the owner, or turn down
        a request to join. Anyone may leave, or take back their own
        request. Their waiting songs leave the queue, and their connections
        to the room close with 4003. Everyone in the room gets
        `members.updated`.
      tags: [rooms]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/admin-join:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: joinRoomAsAdmin
      summary: Join a room you can't otherwise open (admins)
      description: |
        Makes the admin a member. Everyone in the room is told, with a
        `playback.notice` and `members.updated`.
      tags: [rooms]
      responses:
        "200":
          description: The room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/invites:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: listRoomInvites
      summary: The room's invite links
      description: |
        Invites that still work, newest first. Anyone in an unlisted room;
        only the owner or an admin in a private one. Open rooms have none.
      tags: [rooms]
      responses:
        "200":
          description: Invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomInvite"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRoomInvite
      summary: Make an invite link
      description: |
        A link that lets members of the server into a room that isn't open.
        Anyone in an unlisted room may make one; only the owner or an admin
        in a private one. Changing the room's visibility revokes them all.
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomInviteRequest"
      responses:
        "201":
          description: The new invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomInvite"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/invites/{code}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: code
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeRoomInvite
      summary: Revoke an invite link
      description: Whoever made it, the room's owner, or an admin.
      tags: [rooms]
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"

  /room-invites/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomInvite
      summary: Check a room invite before using it
      description: |
        `room_invite_invalid` (404) if it's wrong, expired, used up or
        revoked. Members of the server only.
      tags: [rooms]
      responses:
        "200":
          description: The room the invite is for, and where you stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomInvitePreview"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: useRoomInvite
      summary: Join a room with an invite
      description: |
        Makes you a member, or in a private room that approves who joins,
        asks the owner to let you in (`status: pending`). If you're already
        in, it uses nothing up. Everyone in the room gets `members.updated`.
      tags: [rooms]
      responses:
        "200":
          description: In, or asked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomInviteResult"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/playback:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getPlayback
      summary: What the room is playing
      description: The same state `nowplaying.updated` pushes over the room WebSocket.
      tags: [playback]
      security:
        - session: []
        - display: []
      responses:
        "200":
          description: The playback state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowPlaying"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: controlPlayback
      summary: Play, pause, skip, seek, or vote to skip
      description: |
        The room's `permissions` say who may do what (`forbidden`
        otherwise). The owner may do anything, and whoever queued a song
        may skip it. In a room whose skip permission is `vote`, everyone
        else sends `vote_skip` (and `unvote_skip` to take it back); the
        song is skipped once `skipVotes.needed` have voted.
        `play` needs a speaker (`no_player`); pausing, skipping, seeking or
        voting with nothing playing is `nothing_playing`. A display with
        `audio` on may `play`, `pause` and `skip` in its own room, as
        whoever paired it.
      tags: [playback]
      security:
        - session: []
        - display: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackCommand"
      responses:
        "200":
          description: The playback state after the command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowPlaying"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/player:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    put:
      operationId: claimPlayer
      summary: Become the room's speaker
      description: |
        The device takes over playback from any other speaker. If the room
        is idle and songs are waiting, the first one starts. Needs the
        room's `speaker` permission unless the device already is the
        speaker. A display with `audio` on may claim its own room, as
        whoever paired it; its `deviceId` is always the display's ID.
      tags: [playback]
      security:
        - session: []
        - display: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPlayerRequest"
      responses:
        "200":
          description: The playback state with this device as the speaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowPlaying"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: releasePlayer
      summary: Stop being the room's speaker
      description: The song pauses. The speaker's user or the room's owner may do this, and a display may release itself.
      tags: [playback]
      security:
        - session: []
        - display: []
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The playback state without a speaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowPlaying"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/player/report:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: reportPlayback
      summary: The speaker reports on the song it's streaming
      description: |
        Send `playing` once audio starts, `progress` every few seconds,
        `paused` if playback stopped on its own, then `ended` or `error`.
        Only the speaker may report (`not_player`). Reports about a song
        that's no longer current are ignored; the reply is the current
        state either way.
      tags: [playback]
      security:
        - session: []
        - display: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerReport"
      responses:
        "200":
          description: The current playback state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowPlaying"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/stream/{itemId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: streamQueueItem
      summary: A song's audio
      description: |
        For the playing song, or a queued one to preload. Streamed from the
        song's service through the link of whoever queued it. Supports
        byte ranges when the service does. If the format isn't in `accept`
        it's transcoded (if the server can), and the result can't be seeked
        by bytes: ask for it again with `start` instead. A display with
        `audio` on may stream its own room's songs.
      tags: [playback]
      security:
        - session: []
        - display: []
      parameters:
        - name: Range
          in: header
          schema:
            type: string
          example: bytes=0-
        - name: accept
          in: query
          description: Comma-separated content types the player can decode, e.g. `audio/mpeg,audio/aac,audio/flac`. Empty means any.
          schema:
            type: string
        - name: maxBitrate
          in: query
          description: Bitrate cap in kbit/s, for services or transcodes that can lower it.
          schema:
            type: integer
        - name: start
          in: query
          description: |
            Where to begin, in ms, for a player that can't seek this stream
            by bytes (it answered `Accept-Ranges: none`, so it's
            transcoded). The audio then begins this far into the song. A
            stream that can be seeked by bytes ignores it.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: The whole song
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Part of the song (see Content-Range)
          content:
            audio/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: syncphony_session
      description: |
        Set by the sign-in endpoints. httpOnly, SameSite=Lax, and Secure when
        the server is served over HTTPS. Mutating requests must come from the
        app's own origin (checked with Sec-Fetch-Site / Origin).
    display:
      type: apiKey
      in: cookie
      name: syncphony_display
      description: |
        A paired display's token (see `/display/pairing`). It can read its
        own room and nothing else: the operations that list it here, and
        the room socket. The playback ones (being the speaker, streaming)
        also need the display's `audio` on.

  parameters:
    InviteCode:
      name: code
      in: path
      required: true
      schema:
        type: string

    ResetCode:
      name: code
      in: path
      required: true
      schema:
        type: string

    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: |
        An error. Common statuses: 400 invalid input, 401 not signed in or
        wrong credentials, 403 not allowed, 404 not found, 409 conflict,
        429 too many attempts (see Retry-After).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignedIn:
      description: Signed in; the session cookie is set
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"
    Ceremony:
      description: A WebAuthn ceremony to complete in the browser
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ceremony"

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: 0.1.0

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          example: invalid_credentials
        message:
          type: string
          description: Human-readable explanation.

    Role:
      type: string
      enum: [admin, member]

    User:
      type: object
      required: [id, username, displayName, color, role, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatar:
          type: string
          description: >-
            Image URL, or `icon:<name>` for a built-in icon drawn on `color`.
            Absent means show initials on `color`.
        color:
          type: string
          description: Lane color, `#rrggbb`.
          example: "#7c3aed"
        role:
          $ref: "#/components/schemas/Role"
        guest:
          $ref: "#/components/schemas/UserGuest"
        disabled:
          type: boolean
          description: An admin disabled the account; it can't sign in. Absent means false.
        removed:
          type: boolean
          description: |
            The account was removed, and is kept anonymized only so rooms'
            history adds up. Absent means false.
        createdAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean

    UserAuditEntry:
      type: object
      required: [id, actorName, targetName, action, createdAt]
      properties:
        id:
          type: string
        actorId:
          type: string
          description: Absent when the server's operator did it, from the command line.
        actorName:
          type: string
          description: Their name at the time.
        targetId:
          type: string
        targetName:
          type: string
          description: Their name at the time, even if the account was removed since.
        action:
          type: string
          enum: [role_changed, disabled, enabled, removed, deleted_self]
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    DeleteMeRequest:
      type: object
      properties:
        password:
          type: string
        ceremonyId:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The browser's `PublicKeyCredential.toJSON()`.

    TransferRoomRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string

    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [hasPassword, passkeyCount]
          properties:
            hasPassword:
              type: boolean
            passkeyCount:
              type: integer

    UserGuest:
      type: object
      description: Set on guests, who joined one room with a QR code instead of an invite.
      required: [roomId, expiresAt, ended]
      properties:
        roomId:
          type: string
        expiresAt:
          type: string
          format: date-time
        ended:
          type: boolean
          description: |
            The guest expired or was removed. They're kept only so the room's
            history and recaps can show their name.

    RoomScreens:
      type: object
      description: |
        How the room's big screens show the music (MAD-779). Set from any
        phone by whoever manages the room; every screen follows.
      required: [look, scene, intensity]
      properties:
        look:
          type: string
          enum: [stage, visualizer, auto]
          default: auto
          description: |
            `stage`: now playing, lyrics and what's next. `visualizer`:
            full-screen visuals with now playing small. `auto`: the stage,
            with visuals taking over for songs with no words to sing.
        scene:
          type: string
          maxLength: 32
          default: ""
          description: The visualizer's scene, or "" to pick one that suits each song.
        intensity:
          type: number
          minimum: 0.5
          maximum: 2
          default: 1.5
          description: How strongly the screens move with the music.

    RoomGuests:
      type: object
      description: |
        Whether people without an account may join the room by scanning a
        guest pass, and what they may do.
      required: [allowed, maxSongs, canVote]
      properties:
        allowed:
          type: boolean
          default: false
        maxSongs:
          type: integer
          minimum: 0
          maximum: 100
          default: 10
          description: Songs each guest may add over their visit. 0 means no limit.
        canVote:
          type: boolean
          default: true
          description: Guests may vote to skip and heart songs.

    GuestPass:
      type: object
      required: [id, roomId, url, createdAt, expiresAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        url:
          type: string
          description: The link to show as a QR code. It carries the signed pass.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    CreateGuestPassRequest:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: |
            When the pass, and everyone who joins with it, expires: e.g. the
            end of the night. 15 minutes to 24 hours from now.

    GuestInvite:
      type: object
      required: [roomId, roomName, expiresAt]
      properties:
        roomId:
          type: string
        roomName:
          type: string
        expiresAt:
          type: string
          format: date-time

    JoinAsGuestRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 32

    Guest:
      type: object
      required: [user, joinedAt, expiresAt, songs]
      properties:
        user:
          $ref: "#/components/schemas/User"
        joinedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        songs:
          type: integer
          description: Songs they've added, toward the room's limit.

    Hearts:
      type: object
      required: [roomId, itemId, userIds]
      properties:
        roomId:
          type: string
        itemId:
          type: string
        userIds:
          type: array
          description: Who hearted it, in the order they did.
          items:
            type: string

    Night:
      type: object
      description: |
        A night in the room: from its first song until the host ended it or
        the room went quiet. Fed into recaps.
      required: [id, roomId, startedAt, endedAt, endedBy, plays]
      properties:
        id:
          type: string
        roomId:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        endedBy:
          type: string
          enum: [host, idle]
        plays:
          type: integer
        songOfTheNight:
          $ref: "#/components/schemas/SongOfTheNight"

    SongOfTheNight:
      type: object
      description: The night's most-hearted song. Absent if nothing got a heart.
      required: [item, hearts]
      properties:
        item:
          $ref: "#/components/schemas/QueueItem"
        hearts:
          type: integer

    ProfileUpdate:
      type: object
      description: >-
        Fields to change. `avatar` is an image URL or `icon:<name>`; send it
        as "" to remove it.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        avatar:
          type: string
          maxLength: 2048
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"

    Username:
      type: string
      description: "2 to 32 characters: lowercase letters, digits, `.`, `_` and `-`."
      pattern: "^[a-z0-9._-]{2,32}$"

    Password:
      type: string
      minLength: 8
      maxLength: 256

    SignupRequest:
      type: object
      required: [invite, username, displayName, password]
      properties:
        invite:
          type: string
        username:
          $ref: "#/components/schemas/Username"
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        password:
          $ref: "#/components/schemas/Password"

    PasskeySignupRequest:
      type: object
      required: [invite, username, displayName]
      properties:
        invite:
          type: string
        username:
          $ref: "#/components/schemas/Username"
        displayName:
          type: string
          minLength: 1
          maxLength: 64

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    SetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          $ref: "#/components/schemas/Password"
        signOutOtherSessions:
          type: boolean
          default: true
          description: Sign out every other device. Defaults to true.

    SignedInSession:
      type: object
      description: A device you're signed in on.
      required: [id, userAgent, createdAt, lastSeenAt, current]
      properties:
        id:
          type: string
        userAgent:
          type: string
          description: The browser's User-Agent when it signed in; may be empty.
        createdAt:
          type: string
          format: date-time
          description: When it signed in.
        lastSeenAt:
          type: string
          format: date-time
          description: Roughly when it was last used (updated at most hourly).
        current:
          type: boolean
          description: This is the session making the request.

    UserSession:
      allOf:
        - $ref: "#/components/schemas/SignedInSession"
        - type: object
          required: [userId]
          properties:
            userId:
              type: string

    ServerSettings:
      type: object
      required: [instanceName, inviteExpiryHours]
      properties:
        instanceName:
          type: string
          description: What the app calls this server. Empty means just "Syncphony".
        inviteExpiryHours:
          type: integer
          description: How long a new invite lasts unless whoever makes it says otherwise.

    ServerSettingsUpdate:
      type: object
      properties:
        instanceName:
          type: string
          maxLength: 40
        inviteExpiryHours:
          type: integer
          minimum: 1
          maximum: 720

    ServerInfo:
      type: object
      required: [version, startedAt, databaseBytes, backups]
      properties:
        version:
          type: string
          description: The build, from `git describe`, e.g. `v0.3.0-4-g1a2b3c4`.
        startedAt:
          type: string
          format: date-time
        databaseBytes:
          type: integer
          format: int64
        backups:
          type: array
          description: Backups on the server, newest first.
          items:
            $ref: "#/components/schemas/Backup"

    Backup:
      type: object
      required: [name, createdAt, bytes]
      properties:
        name:
          type: string
          example: syncphony-20261006-193000.db
        createdAt:
          type: string
          format: date-time
        bytes:
          type: integer
          format: int64

    RoomActivity:
      type: object
      required: [roomId, roomName, ownerId, visibility, canEnter, members, state]
      properties:
        roomId:
          type: string
        roomName:
          type: string
        ownerId:
          type: string
        visibility:
          $ref: "#/components/schemas/RoomVisibility"
        canEnter:
          type: boolean
          description: You can open the room. If not, join it as an admin first.
        members:
          type: array
          description: IDs of who has the room open right now.
          items:
            type: string
        state:
          $ref: "#/components/schemas/PlaybackState"
        title:
          type: string
          description: The song playing or paused, if any.
        player:
          $ref: "#/components/schemas/Player"

    RoomTaste:
      type: object
      required: [nights, shifted, tonight, avoided, artists, tags]
      properties:
        nights:
          type: integer
          description: How many past nights the DJ has learned from.
        shifted:
          type: boolean
          description: The vibe is changing, so the latest songs count more.
        tonight:
          type: array
          description: The artists the room likes tonight, most first.
          items:
            $ref: "#/components/schemas/TonightArtist"
        avoided:
          type: array
          description: Artists the room turned away lately.
          items:
            type: string
        artists:
          type: array
          description: |
            The artists the room liked over past nights, most first, then
            those it turned away.
          items:
            $ref: "#/components/schemas/LastingArtist"
        tags:
          type: array
          description: The tags the room liked over past nights, most first.
          items:
            $ref: "#/components/schemas/TasteTag"

    TonightArtist:
      type: object
      required: [name, weight, plays]
      properties:
        name:
          type: string
        weight:
          type: number
          description: From 0 to 1, against the room's favorite.
        plays:
          type: integer
          description: Songs of theirs members chose or let play through.

    LastingArtist:
      type: object
      required: [name, weight, veto, nightsAgo, throwback]
      properties:
        name:
          type: string
        weight:
          type: number
          description: From 0 to 1, against the artist the room liked most.
        veto:
          type: number
          description: How much the room turned them away, from 0 to 1. It fades by night.
        nightsAgo:
          type: integer
          description: How many nights ago the room last liked them; 0 is the last night.
        lovedAt:
          type: string
          format: date-time
          description: When that night ended. Absent if the room never liked them.
        throwback:
          type: boolean
          description: The DJ could bring them back as a throwback now.

    TasteTag:
      type: object
      required: [name, weight]
      properties:
        name:
          type: string
        weight:
          type: number
          description: From 0 to 1, against the strongest.

    Ceremony:
      type: object
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          description: Pass back to the matching finish endpoint within 5 minutes.
        options:
          type: object
          additionalProperties: true
          description: |
            WebAuthn options as JSON (`publicKey` inside). Decode with
            `PublicKeyCredential.parseCreationOptionsFromJSON` or
            `parseRequestOptionsFromJSON`.

    FinishCeremony:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The browser's `PublicKeyCredential.toJSON()`.
        name:
          type: string
          maxLength: 64
          description: Label for a new passkey, e.g. "Pixel 9". Optional.

    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          description: Credential ID, base64url
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    InviteInfo:
      type: object
      required: [role, expiresAt]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time

    Invite:
      type: object
      required: [code, url, role, createdAt, expiresAt]
      properties:
        code:
          type: string
        url:
          type: string
          description: Link to share; opens the signup page.
        role:
          $ref: "#/components/schemas/Role"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
