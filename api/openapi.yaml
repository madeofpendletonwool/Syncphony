openapi: 3.0.3
info:
  title: Syncphony API
  version: 0.1.0
  description: |
    Shared, fair music queue across streaming services.
    This file is the source of truth for the HTTP API. Go server types and the
    web client's TypeScript types are generated from it (`make gen`).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and build info
      tags: [system]
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: 0.1.0
