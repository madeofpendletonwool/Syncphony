openapi: 3.0.3
info:
  title: Syncphony API
  version: 0.1.0
  description: |
    Shared, fair music queue across streaming services.
    This file is the source of truth for the HTTP API. Go server types and the
    web client's TypeScript types are generated from it (`make gen`).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and build info
      tags: [system]
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  # --- Signup and sign-in ---------------------------------------------------

  /invites/{code}:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: getInvite
      summary: Check an invite before signing up
      description: Returns 404 if the invite doesn't exist, was used, or expired.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The invite can be used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteInvite
      summary: Revoke an invite (admin)
      tags: [admin]
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"

  /auth/signup:
    post:
      operationId: signup
      summary: Create an account with an invite and a password
      description: Signs the new user in.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/signup/passkey/begin:
    post:
      operationId: beginPasskeySignup
      summary: Start creating an account with an invite and a passkey
      description: |
        Returns WebAuthn creation options for `navigator.credentials.create`.
        The account is created when the ceremony finishes.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeySignupRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /auth/signup/passkey/finish:
    post:
      operationId: finishPasskeySignup
      summary: Finish creating an account with a passkey
      description: Signs the new user in.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCeremony"
      responses:
        "201":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Sign in with a username and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/passkey/begin:
    post:
      operationId: beginPasskeyLogin
      summary: Start signing in with a passkey
      description: Returns WebAuthn request options for `navigator.credentials.get`. No username needed.
      tags: [auth]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /auth/passkey/finish:
    post:
      operationId: finishPasskeyLogin
      summary: Finish signing in with a passkey
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCeremony"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out this session
      tags: [auth]
      security: []
      responses:
        "204":
          description: Signed out; the session cookie is cleared
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  # --- The signed-in user ---------------------------------------------------

  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [account]
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Update your profile
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"

  /me/password:
    put:
      operationId: setPassword
      summary: Set or change your password
      description: |
        `currentPassword` is required if you already have one. Other sessions
        are signed out.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          description: Password set
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePassword
      summary: Remove your password (passkey-only sign-in)
      description: Fails with 409 if you have no passkey.
      tags: [account]
      responses:
        "204":
          description: Password removed
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys:
    get:
      operationId: listPasskeys
      summary: Your passkeys
      tags: [account]
      responses:
        "200":
          description: Passkeys, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Passkey"
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys/begin:
    post:
      operationId: beginAddPasskey
      summary: Start adding a passkey
      tags: [account]
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys/finish:
    post:
      operationId: finishAddPasskey
      summary: Finish adding a passkey
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCeremony"
      responses:
        "201":
          description: The new passkey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Credential ID, base64url
        schema:
          type: string
    patch:
      operationId: renamePasskey
      summary: Rename a passkey
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "204":
          description: Renamed
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePasskey
      summary: Remove a passkey
      description: Fails with 409 if it's your only way to sign in.
      tags: [account]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  # --- People and invites ---------------------------------------------------

  /users:
    get:
      operationId: listUsers
      summary: Everyone on this server
      tags: [account]
      responses:
        "200":
          description: Users, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /invites:
    get:
      operationId: listInvites
      summary: All invites (admin)
      tags: [admin]
      responses:
        "200":
          description: Invites, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvite
      summary: Create an invite link (admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The new invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"

  # --- Linked services ------------------------------------------------------

  /providers:
    get:
      operationId: listProviders
      summary: Services that can be linked
      tags: [links]
      responses:
        "200":
          description: Providers, in registration order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderInfo"
        default:
          $ref: "#/components/responses/Error"

  /links:
    get:
      operationId: listLinks
      summary: Your linked service accounts
      description: Credentials are never returned.
      tags: [links]
      parameters:
        - name: include
          in: query
          description: "`shared`: also list links others have shared, after yours."
          schema:
            type: string
            enum: [shared]
      responses:
        "200":
          description: Links, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLink
      summary: Link an account with a form (credentials providers)
      description: |
        Validates the fields with the service. Linking an account you've
        already linked updates that link.
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: relink
      summary: Re-link with new credentials (credentials providers)
      description: Must be the same account. Clears `needs_relink`.
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelinkRequest"
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateLink
      summary: Share a link with everyone, or stop sharing it
      description: |
        Only services whose `shareable` capability is set can be shared
        (`not_shareable` otherwise). Songs already queued from a link keep
        playing after it's unshared.
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLinkRequest"
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlink
      summary: Unlink and delete the stored credentials
      description: Queued tracks from this link stay in the queue but can't play.
      tags: [links]
      responses:
        "204":
          description: Unlinked
        default:
          $ref: "#/components/responses/Error"

  /links/oauth:
    post:
      operationId: beginOAuthLink
      summary: Start linking (or re-linking) an OAuth2 provider
      description: |
        Send the browser to `authUrl`. The service redirects back to
        `/api/links/oauth/callback`, which lands on the web app's
        `/settings/services` page.
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginOAuthLinkRequest"
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required: [authUrl]
                properties:
                  authUrl:
                    type: string
        default:
          $ref: "#/components/responses/Error"

  /links/oauth/callback:
    get:
      operationId: completeOAuthLink
      summary: OAuth2 redirect target (browser navigation)
      description: |
        Finishes linking and redirects to `/settings/services?linked=<link id>`,
        or `/settings/services?link_error=<error code>` on failure. Needs the
        session cookie, but always redirects rather than returning an error.
      tags: [links]
      security: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the service when the user declined.
          schema:
            type: string
      responses:
        "303":
          description: Back to the web app
          headers:
            Location:
              schema:
                type: string

  # --- Browsing your services ----------------------------------------------

  /search:
    get:
      operationId: search
      summary: Search every service you've linked, and shared ones
      description: |
        Searches each of your links, and every link someone has shared, at
        once for tracks, albums and artists.
        Each link's results come back as a group, in link order. A link that
        fails (offline, needs re-linking, too slow) gets a group with
        `error` set instead of failing the whole search.
      tags: [browse]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          description: Most results per kind, per link.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Results, one group per link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/albums/{albumId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: albumId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAlbum
      summary: An album and its tracks, through one of your links or a shared one
      tags: [browse]
      responses:
        "200":
          description: The album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDetail"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/artists/{artistId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: artistId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getArtist
      summary: An artist and their albums, through one of your links or a shared one
      tags: [browse]
      responses:
        "200":
          description: The artist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistDetail"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}/artwork:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLinkArtwork
      summary: An image from one of your links or a shared one
      description: For `artwork` refs in search and browse results. Cacheable.
      tags: [browse]
      parameters:
        - name: ref
          in: query
          required: true
          schema:
            type: string
        - name: size
          in: query
          description: Wanted width in pixels; a hint.
          schema:
            type: integer
            minimum: 0
            maximum: 2048
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getQueue
      summary: The room's queue and its fair play order
      description: The same snapshot `queue.updated` pushes over the room WebSocket.
      tags: [queue]
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addToQueue
      summary: Add songs to the end of your lane
      description: |
        Each song is looked up on its service through one of your links, and
        its metadata is kept with the queue item. All are added, in order, or
        none are.
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToQueueRequest"
      responses:
        "200":
          description: The queue after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/history:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getHistory
      summary: Songs the room played recently, newest first
      description: |
        Songs that finished, were skipped or failed. The song playing now
        isn't included until it ends. Refetch on `nowplaying.updated` when
        the song changes.
      tags: [queue]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recent plays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayedItem"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/{itemId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: moveQueueItem
      summary: Move one of your queued songs within your lane
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveQueueItemRequest"
      responses:
        "200":
          description: The queue after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeQueueItem
      summary: Remove a queued song
      description: |
        Your own songs, or anyone's if you own the room. The playing song
        can't be removed (`not_queued`); skip it instead.
      tags: [queue]
      responses:
        "200":
          description: The queue after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSnapshot"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/queue/{itemId}/artwork:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getQueueItemArtwork
      summary: A queued song's artwork
      description: |
        Loaded through the link of whoever queued the song, so everyone in
        the room can see it. 404 if the song has none or its link is gone.
      tags: [queue]
      parameters:
        - name: size
          in: query
          description: Wanted width in pixels; a hint.
          schema:
            type: integer
            minimum: 0
            maximum: 2048
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

  /rooms:
    get:
      operationId: listRooms
      summary: Every room
      tags: [rooms]
      responses:
        "200":
          description: Rooms, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRoom
      summary: Create a room you own
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: The new room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getRoom
      summary: A room
      tags: [rooms]
      responses:
        "200":
          description: The room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateRoom
      summary: Change a room you own
      description: A new fairness mode reorders the queue at once.
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
      responses:
        "200":
          description: The room after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/playback:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getPlayback
      summary: What the room is playing
      description: The same state `nowplaying.updated` pushes over the room WebSocket.
      tags: [playback]
      responses:
        "200":
          description: The playback state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowPlaying"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: controlPlayback
      summary: Play, pause, skip or seek
      description: |
        Allowed for the room's owner, for everyone when the room's
        `controls` is `everyone`, and for skipping your own song.
        `play` needs a speaker (`no_player`); pausing, skipping or seeking
        with nothing playing is `nothing_playing`.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackCommand"
      responses:
        "200":
          description: The playback state after the command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowPlaying"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/player:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    put:
      operationId: claimPlayer
      summary: Become the room's speaker
      description: |
        The device takes over playback from any other speaker. If the room
        is idle and songs are waiting, the first one starts. Needs playback
        control (see `controlPlayback`) unless the device already is the
        speaker.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPlayerRequest"
      responses:
        "200":
          description: The playback state with this device as the speaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowPlaying"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: releasePlayer
      summary: Stop being the room's speaker
      description: The song pauses. The speaker's user or the room's owner may do this.
      tags: [playback]
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The playback state without a speaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowPlaying"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/player/report:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: reportPlayback
      summary: The speaker reports on the song it's streaming
      description: |
        Send `playing` once audio starts, `progress` every few seconds,
        `paused` if playback stopped on its own, then `ended` or `error`.
        Only the speaker may report (`not_player`). Reports about a song
        that's no longer current are ignored; the reply is the current
        state either way.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerReport"
      responses:
        "200":
          description: The current playback state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowPlaying"
        default:
          $ref: "#/components/responses/Error"

  /rooms/{roomId}/stream/{itemId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: streamQueueItem
      summary: A song's audio
      description: |
        For the playing song, or a queued one to preload. Streamed from the
        song's service through the link of whoever queued it. Supports
        byte ranges when the service does. If the format isn't in `accept`
        it's transcoded (if the server can), and the result isn't seekable.
      tags: [playback]
      parameters:
        - name: Range
          in: header
          schema:
            type: string
          example: bytes=0-
        - name: accept
          in: query
          description: Comma-separated content types the player can decode, e.g. `audio/mpeg,audio/aac,audio/flac`. Empty means any.
          schema:
            type: string
        - name: maxBitrate
          in: query
          description: Bitrate cap in kbit/s, for services or transcodes that can lower it.
          schema:
            type: integer
      responses:
        "200":
          description: The whole song
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Part of the song (see Content-Range)
          content:
            audio/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: syncphony_session
      description: |
        Set by the sign-in endpoints. httpOnly, SameSite=Lax, and Secure when
        the server is served over HTTPS. Mutating requests must come from the
        app's own origin (checked with Sec-Fetch-Site / Origin).

  parameters:
    InviteCode:
      name: code
      in: path
      required: true
      schema:
        type: string

    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: |
        An error. Common statuses: 400 invalid input, 401 not signed in or
        wrong credentials, 403 not allowed, 404 not found, 409 conflict,
        429 too many attempts (see Retry-After).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignedIn:
      description: Signed in; the session cookie is set
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"
    Ceremony:
      description: A WebAuthn ceremony to complete in the browser
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ceremony"

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: 0.1.0

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          example: invalid_credentials
        message:
          type: string
          description: Human-readable explanation.

    Role:
      type: string
      enum: [admin, member]

    User:
      type: object
      required: [id, username, displayName, color, role, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatar:
          type: string
          description: Image URL. Absent means show initials on `color`.
        color:
          type: string
          description: Lane color, `#rrggbb`.
          example: "#7c3aed"
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [hasPassword, passkeyCount]
          properties:
            hasPassword:
              type: boolean
            passkeyCount:
              type: integer

    ProfileUpdate:
      type: object
      description: Fields to change. Send `avatar` as "" to remove it.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        avatar:
          type: string
          maxLength: 2048
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"

    Username:
      type: string
      description: "2 to 32 characters: lowercase letters, digits, `.`, `_` and `-`."
      pattern: "^[a-z0-9._-]{2,32}$"

    Password:
      type: string
      minLength: 8
      maxLength: 256

    SignupRequest:
      type: object
      required: [invite, username, displayName, password]
      properties:
        invite:
          type: string
        username:
          $ref: "#/components/schemas/Username"
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        password:
          $ref: "#/components/schemas/Password"

    PasskeySignupRequest:
      type: object
      required: [invite, username, displayName]
      properties:
        invite:
          type: string
        username:
          $ref: "#/components/schemas/Username"
        displayName:
          type: string
          minLength: 1
          maxLength: 64

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    SetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          $ref: "#/components/schemas/Password"

    Ceremony:
      type: object
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          description: Pass back to the matching finish endpoint within 5 minutes.
        options:
          type: object
          additionalProperties: true
          description: |
            WebAuthn options as JSON (`publicKey` inside). Decode with
            `PublicKeyCredential.parseCreationOptionsFromJSON` or
            `parseRequestOptionsFromJSON`.

    FinishCeremony:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The browser's `PublicKeyCredential.toJSON()`.
        name:
          type: string
          maxLength: 64
          description: Label for a new passkey, e.g. "Pixel 9". Optional.

    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          description: Credential ID, base64url
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    InviteInfo:
      type: object
      required: [role, expiresAt]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time

    Invite:
      type: object
      required: [code, url, role, createdAt, expiresAt]
      properties:
        code:
          type: string
        url:
          type: string
          description: Link to share; opens the signup page.
        role:
          $ref: "#/components/schemas/Role"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        usedBy:
          type: string
        usedAt:
          type: string
          format: date-time

    CreateInviteRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168

    ProviderInfo:
      type: object
      required: [id, name, icon, playback, linkMethod, fields, capabilities]
      properties:
        id:
          type: string
          example: navidrome
        name:
          type: string
        icon:
          type: string
        playback:
          type: string
          enum: [stream, remote]
        linkMethod:
          type: string
          enum: [credentials, oauth2]
        fields:
          type: array
          description: The form to show for `credentials` providers. Empty for `oauth2`.
          items:
            $ref: "#/components/schemas/LinkField"
        capabilities:
          type: object
          required: [search, playlists, artwork, lyrics, isrc, shareable]
          properties:
            search:
              type: array
              items:
                type: string
                enum: [track, album, artist, playlist]
            playlists:
              type: boolean
            artwork:
              type: boolean
            lyrics:
              type: boolean
            isrc:
              type: boolean
            shareable:
              type: boolean
              description: Links to this service can be shared with everyone on the server.

    LinkField:
      type: object
      required: [name, label, kind, required]
      properties:
        name:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [text, url, secret]
          description: "`secret` fields must be masked."
        required:
          type: boolean
        placeholder:
          type: string
        help:
          type: string

    ServiceLink:
      type: object
      required: [id, ownerId, provider, accountLabel, status, shared, createdAt]
      properties:
        id:
          type: string
        ownerId:
          type: string
          description: The user who linked it. Not you when it's someone's shared link.
        provider:
          type: string
        accountLabel:
          type: string
          example: alice on music.example.com
        status:
          type: string
          enum: [ok, needs_relink, error]
          description: "`needs_relink`: the service stopped accepting the credentials; link again."
        statusDetail:
          type: string
        shared:
          type: boolean
          description: Everyone on the server can search and queue from it.
        createdAt:
          type: string
          format: date-time
        lastOkAt:
          type: string
          format: date-time

    CreateLinkRequest:
      type: object
      required: [provider, fields]
      properties:
        provider:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string

    # --- Browsing ---------------------------------------------------------------

    ArtistCredit:
      type: object
      required: [name]
      properties:
        id:
          type: string
          description: The artist's ID on the same link, if known.
        name:
          type: string

    AlbumCredit:
      type: object
      required: [title]
      properties:
        id:
          type: string
        title:
          type: string

    TrackResult:
      type: object
      description: A track you can queue with `linkId` and `trackId`.
      required: [linkId, provider, trackId, title, artists, durationMs, explicit]
      properties:
        linkId:
          type: string
        provider:
          type: string
        trackId:
          type: string
        title:
          type: string
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistCredit"
        album:
          $ref: "#/components/schemas/AlbumCredit"
        durationMs:
          type: integer
          format: int64
        explicit:
          type: boolean
        artwork:
          type: string
          description: Load with `/links/{linkId}/artwork?ref=`.

    AlbumResult:
      type: object
      required: [id, title, artists]
      properties:
        id:
          type: string
        title:
          type: string
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistCredit"
        year:
          type: integer
        trackCount:
          type: integer
        artwork:
          type: string

    ArtistResult:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        artwork:
          type: string

    SearchGroup:
      type: object
      description: One link's search results.
      required: [linkId, ownerId, provider, accountLabel, tracks, albums, artists]
      properties:
        linkId:
          type: string
        ownerId:
          type: string
          description: Who linked it; someone else when it's a shared link.
        provider:
          type: string
        accountLabel:
          type: string
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackResult"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/AlbumResult"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistResult"
        error:
          $ref: "#/components/schemas/Error"

    SearchResults:
      type: object
      required: [query, groups]
      properties:
        query:
          type: string
        groups:
          type: array
          description: Empty if you have no links.
          items:
            $ref: "#/components/schemas/SearchGroup"

    AlbumDetail:
      type: object
      required: [linkId, provider, album, tracks]
      properties:
        linkId:
          type: string
        provider:
          type: string
        album:
          $ref: "#/components/schemas/AlbumResult"
        tracks:
          type: array
          description: In album order.
          items:
            $ref: "#/components/schemas/TrackResult"

    ArtistDetail:
      type: object
      required: [linkId, provider, artist, albums]
      properties:
        linkId:
          type: string
        provider:
          type: string
        artist:
          $ref: "#/components/schemas/ArtistResult"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/AlbumResult"

    AddToQueueRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/TrackToQueue"

    TrackToQueue:
      type: object
      required: [linkId, trackId]
      properties:
        linkId:
          type: string
          description: One of your links.
        trackId:
          type: string
          description: The track's ID on that service, from search.

    MoveQueueItemRequest:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          minimum: 0
          description: Where in your lane to put the song; 0 is the front. Past the end means the end.

    UpdateLinkRequest:
      type: object
      required: [shared]
      properties:
        shared:
          type: boolean

    RelinkRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            type: string

    BeginOAuthLinkRequest:
      type: object
      description: Set `provider` to link a new account, or `linkId` to re-link one.
      properties:
        provider:
          type: string
        linkId:
          type: string

    # --- Realtime ---------------------------------------------------------------
    # These are pushed over the WebSocket at /ws/rooms/{roomId}, not served
    # from a path here.

    RoomEvent:
      type: object
      description: |
        A message on the room WebSocket, `GET /ws/rooms/{roomId}?since=<version>`.
        The socket needs the session cookie and is server-push only: send
        changes over the REST API.

        `data` by `type`:
        - `hello`: RoomHello. Always first.
        - `queue.updated`: QueueSnapshot. Sent after hello unless `since`
          equals the current version, then on every change.
        - `nowplaying.updated`: NowPlaying. Sent after hello, then on change.
        - `playback.notice`: PlaybackNotice. Something to tell members, like
          a song skipped because it couldn't play.
        - `member.joined`, `member.left`: User. Someone's first connection to
          the room opened, or their last one closed.
        - `link.status`: ServiceLink. One of your links changed status.

        Close code 1013 (try again later) means the client fell behind and
        missed events: reconnect with `since` set to the last version seen.
        Close code 4001 means the session ended; sign in again.
      required: [type, data]
      properties:
        type:
          type: string
          enum: [hello, queue.updated, nowplaying.updated, playback.notice, member.joined, member.left, link.status]
        version:
          type: integer
          format: int64
          description: Queue version, on `queue.updated` only.
        data:
          type: object

    RoomHello:
      type: object
      required: [roomId, roomName, you, members]
      properties:
        roomId:
          type: string
        roomName:
          type: string
        you:
          type: string
          description: Your user ID.
        members:
          type: array
          description: Everyone connected to the room right now, you included.
          items:
            $ref: "#/components/schemas/User"

    QueueSnapshot:
      type: object
      required: [roomId, version, items, upNext]
      properties:
        roomId:
          type: string
        version:
          type: integer
          format: int64
        items:
          type: array
          description: |
            The playing item and everything queued, grouped by who added it,
            each lane in order.
          items:
            $ref: "#/components/schemas/QueueItem"
        upNext:
          type: array
          description: |
            IDs of the queued items in the order they will play, as the room's
            fairness mode interleaves the lanes. The playing item isn't included.
          items:
            type: string

    QueueItem:
      type: object
      required: [id, addedBy, state, lanePosition, addedAt, track]
      properties:
        id:
          type: string
        addedBy:
          type: string
          description: User ID.
        state:
          type: string
          enum: [queued, playing, played, skipped, removed]
        lanePosition:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        track:
          $ref: "#/components/schemas/QueuedTrack"

    PlayedItem:
      type: object
      required: [item, startedAt, endedAt, endReason]
      properties:
        item:
          $ref: "#/components/schemas/QueueItem"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        endReason:
          type: string
          enum: [finished, skipped, removed, error]

    QueuedTrack:
      type: object
      description: The track as it was when queued; still shown if its service is offline.
      required: [provider, trackId, title, artists, durationMs, explicit]
      properties:
        provider:
          type: string
        linkId:
          type: string
          description: Absent if the link was removed; the track can't play then.
        trackId:
          type: string
        title:
          type: string
        artists:
          type: array
          items:
            type: string
        artistIds:
          type: array
          description: |
            The provider's ID for each of `artists`, in the same order, within
            `linkId`. Empty where the provider didn't say.
          items:
            type: string
        album:
          type: string
        albumId:
          type: string
          description: The provider's album ID within `linkId`, if known.
        durationMs:
          type: integer
          format: int64
        explicit:
          type: boolean
        artwork:
          type: string

    NowPlaying:
      type: object
      description: |
        A room's playback, as the server sees it. While `playing`, the
        position is `positionMs` at `at` and advances with the clock.
      required: [roomId, state, positionMs, at, revision]
      properties:
        roomId:
          type: string
        state:
          $ref: "#/components/schemas/PlaybackState"
        item:
          $ref: "#/components/schemas/QueueItem"
        driver:
          type: string
          enum: [stream, remote]
          description: |
            How `item` plays. `stream`: the speaker plays it from
            `/rooms/{roomId}/stream/{itemId}`. `remote`: the song's service
            plays it on its own device, and the speaker just shows it.
        positionMs:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
          description: Server time `positionMs` was true at.
        revision:
          type: integer
          format: int64
          description: |
            Increases whenever the speaker must act: a new song, play,
            pause, or seek. Apply each revision once.
        player:
          $ref: "#/components/schemas/Player"
        next:
          $ref: "#/components/schemas/QueueItem"

    PlaybackState:
      type: string
      enum: [idle, loading, playing, paused]
      description: |
        `idle`: nothing to play, or no speaker. `loading`: waiting for the
        speaker to start the song.

    Player:
      type: object
      description: The device a room plays through.
      required: [deviceId, userId, name, lastSeen]
      properties:
        deviceId:
          type: string
        userId:
          type: string
        name:
          type: string
        lastSeen:
          type: string
          format: date-time

    PlaybackCommand:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [play, pause, skip, seek]
        positionMs:
          type: integer
          format: int64
          minimum: 0
          description: Where to seek to.
        itemId:
          type: string
          description: Skip only if this is still the current song, so two people tapping skip skip one song.

    ClaimPlayerRequest:
      type: object
      required: [deviceId, name]
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          description: A stable ID the device makes up and keeps.
        name:
          type: string
          maxLength: 64
          example: Collin's phone

    PlayerReport:
      type: object
      required: [deviceId, itemId, event, positionMs]
      properties:
        deviceId:
          type: string
        itemId:
          type: string
        event:
          type: string
          enum: [playing, progress, paused, ended, error]
        positionMs:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string
          maxLength: 500
          description: What went wrong, for `error`.

    PlaybackNotice:
      type: object
      description: Something members should hear about, like a song skipped because its service failed.
      required: [roomId, message]
      properties:
        roomId:
          type: string
        itemId:
          type: string
        message:
          type: string

    FairnessMode:
      type: string
      enum: [round_robin, fifo]

    RoomControls:
      type: string
      enum: [everyone, owner]
      description: Who may play, pause, skip, seek and become the speaker. The owner always may, and anyone may skip their own song.

    Room:
      type: object
      required: [id, name, ownerId, fairnessMode, controls, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        ownerId:
          type: string
        fairnessMode:
          $ref: "#/components/schemas/FairnessMode"
        controls:
          $ref: "#/components/schemas/RoomControls"
        createdAt:
          type: string
          format: date-time

    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        fairnessMode:
          $ref: "#/components/schemas/FairnessMode"
        controls:
          $ref: "#/components/schemas/RoomControls"

    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        fairnessMode:
          $ref: "#/components/schemas/FairnessMode"
        controls:
          $ref: "#/components/schemas/RoomControls"
