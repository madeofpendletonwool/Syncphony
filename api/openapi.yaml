openapi: 3.0.3
info:
  title: Syncphony API
  version: 0.1.0
  description: |
    Shared, fair music queue across streaming services.
    This file is the source of truth for the HTTP API. Go server types and the
    web client's TypeScript types are generated from it (`make gen`).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and build info
      tags: [system]
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  # --- Signup and sign-in ---------------------------------------------------

  /invites/{code}:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: getInvite
      summary: Check an invite before signing up
      description: Returns 404 if the invite doesn't exist, was used, or expired.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The invite can be used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteInvite
      summary: Revoke an invite (admin)
      tags: [admin]
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"

  /auth/signup:
    post:
      operationId: signup
      summary: Create an account with an invite and a password
      description: Signs the new user in.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/signup/passkey/begin:
    post:
      operationId: beginPasskeySignup
      summary: Start creating an account with an invite and a passkey
      description: |
        Returns WebAuthn creation options for `navigator.credentials.create`.
        The account is created when the ceremony finishes.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeySignupRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /auth/signup/passkey/finish:
    post:
      operationId: finishPasskeySignup
      summary: Finish creating an account with a passkey
      description: Signs the new user in.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCeremony"
      responses:
        "201":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Sign in with a username and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/passkey/begin:
    post:
      operationId: beginPasskeyLogin
      summary: Start signing in with a passkey
      description: Returns WebAuthn request options for `navigator.credentials.get`. No username needed.
      tags: [auth]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /auth/passkey/finish:
    post:
      operationId: finishPasskeyLogin
      summary: Finish signing in with a passkey
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCeremony"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out this session
      tags: [auth]
      security: []
      responses:
        "204":
          description: Signed out; the session cookie is cleared
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  # --- The signed-in user ---------------------------------------------------

  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [account]
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Update your profile
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"

  /me/password:
    put:
      operationId: setPassword
      summary: Set or change your password
      description: |
        `currentPassword` is required if you already have one. Other sessions
        are signed out.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          description: Password set
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePassword
      summary: Remove your password (passkey-only sign-in)
      description: Fails with 409 if you have no passkey.
      tags: [account]
      responses:
        "204":
          description: Password removed
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys:
    get:
      operationId: listPasskeys
      summary: Your passkeys
      tags: [account]
      responses:
        "200":
          description: Passkeys, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Passkey"
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys/begin:
    post:
      operationId: beginAddPasskey
      summary: Start adding a passkey
      tags: [account]
      responses:
        "200":
          $ref: "#/components/responses/Ceremony"
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys/finish:
    post:
      operationId: finishAddPasskey
      summary: Finish adding a passkey
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCeremony"
      responses:
        "201":
          description: The new passkey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        default:
          $ref: "#/components/responses/Error"

  /me/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Credential ID, base64url
        schema:
          type: string
    patch:
      operationId: renamePasskey
      summary: Rename a passkey
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "204":
          description: Renamed
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePasskey
      summary: Remove a passkey
      description: Fails with 409 if it's your only way to sign in.
      tags: [account]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  # --- People and invites ---------------------------------------------------

  /users:
    get:
      operationId: listUsers
      summary: Everyone on this server
      tags: [account]
      responses:
        "200":
          description: Users, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /invites:
    get:
      operationId: listInvites
      summary: All invites (admin)
      tags: [admin]
      responses:
        "200":
          description: Invites, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvite
      summary: Create an invite link (admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The new invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"

  # --- Linked services ------------------------------------------------------

  /providers:
    get:
      operationId: listProviders
      summary: Services that can be linked
      tags: [links]
      responses:
        "200":
          description: Providers, in registration order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderInfo"
        default:
          $ref: "#/components/responses/Error"

  /links:
    get:
      operationId: listLinks
      summary: Your linked service accounts
      description: Credentials are never returned.
      tags: [links]
      responses:
        "200":
          description: Links, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLink
      summary: Link an account with a form (credentials providers)
      description: |
        Validates the fields with the service. Linking an account you've
        already linked updates that link.
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"

  /links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: relink
      summary: Re-link with new credentials (credentials providers)
      description: Must be the same account. Clears `needs_relink`.
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelinkRequest"
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLink"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlink
      summary: Unlink and delete the stored credentials
      description: Queued tracks from this link stay in the queue but can't play.
      tags: [links]
      responses:
        "204":
          description: Unlinked
        default:
          $ref: "#/components/responses/Error"

  /links/oauth:
    post:
      operationId: beginOAuthLink
      summary: Start linking (or re-linking) an OAuth2 provider
      description: |
        Send the browser to `authUrl`. The service redirects back to
        `/api/links/oauth/callback`, which lands on the web app's
        `/settings/services` page.
      tags: [links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginOAuthLinkRequest"
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required: [authUrl]
                properties:
                  authUrl:
                    type: string
        default:
          $ref: "#/components/responses/Error"

  /links/oauth/callback:
    get:
      operationId: completeOAuthLink
      summary: OAuth2 redirect target (browser navigation)
      description: |
        Finishes linking and redirects to `/settings/services?linked=<link id>`,
        or `/settings/services?link_error=<error code>` on failure. Needs the
        session cookie, but always redirects rather than returning an error.
      tags: [links]
      security: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the service when the user declined.
          schema:
            type: string
      responses:
        "303":
          description: Back to the web app
          headers:
            Location:
              schema:
                type: string

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: syncphony_session
      description: |
        Set by the sign-in endpoints. httpOnly, SameSite=Lax, and Secure when
        the server is served over HTTPS. Mutating requests must come from the
        app's own origin (checked with Sec-Fetch-Site / Origin).

  parameters:
    InviteCode:
      name: code
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: |
        An error. Common statuses: 400 invalid input, 401 not signed in or
        wrong credentials, 403 not allowed, 404 not found, 409 conflict,
        429 too many attempts (see Retry-After).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignedIn:
      description: Signed in; the session cookie is set
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"
    Ceremony:
      description: A WebAuthn ceremony to complete in the browser
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ceremony"

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: 0.1.0

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          example: invalid_credentials
        message:
          type: string
          description: Human-readable explanation.

    Role:
      type: string
      enum: [admin, member]

    User:
      type: object
      required: [id, username, displayName, color, role, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatar:
          type: string
          description: Image URL. Absent means show initials on `color`.
        color:
          type: string
          description: Lane color, `#rrggbb`.
          example: "#7c3aed"
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [hasPassword, passkeyCount]
          properties:
            hasPassword:
              type: boolean
            passkeyCount:
              type: integer

    ProfileUpdate:
      type: object
      description: Fields to change. Send `avatar` as "" to remove it.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        avatar:
          type: string
          maxLength: 2048
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"

    Username:
      type: string
      description: "2 to 32 characters: lowercase letters, digits, `.`, `_` and `-`."
      pattern: "^[a-z0-9._-]{2,32}$"

    Password:
      type: string
      minLength: 8
      maxLength: 256

    SignupRequest:
      type: object
      required: [invite, username, displayName, password]
      properties:
        invite:
          type: string
        username:
          $ref: "#/components/schemas/Username"
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        password:
          $ref: "#/components/schemas/Password"

    PasskeySignupRequest:
      type: object
      required: [invite, username, displayName]
      properties:
        invite:
          type: string
        username:
          $ref: "#/components/schemas/Username"
        displayName:
          type: string
          minLength: 1
          maxLength: 64

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    SetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          $ref: "#/components/schemas/Password"

    Ceremony:
      type: object
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          description: Pass back to the matching finish endpoint within 5 minutes.
        options:
          type: object
          additionalProperties: true
          description: |
            WebAuthn options as JSON (`publicKey` inside). Decode with
            `PublicKeyCredential.parseCreationOptionsFromJSON` or
            `parseRequestOptionsFromJSON`.

    FinishCeremony:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The browser's `PublicKeyCredential.toJSON()`.
        name:
          type: string
          maxLength: 64
          description: Label for a new passkey, e.g. "Pixel 9". Optional.

    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          description: Credential ID, base64url
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    InviteInfo:
      type: object
      required: [role, expiresAt]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time

    Invite:
      type: object
      required: [code, url, role, createdAt, expiresAt]
      properties:
        code:
          type: string
        url:
          type: string
          description: Link to share; opens the signup page.
        role:
          $ref: "#/components/schemas/Role"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        usedBy:
          type: string
        usedAt:
          type: string
          format: date-time

    CreateInviteRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168

    ProviderInfo:
      type: object
      required: [id, name, icon, playback, linkMethod, fields, capabilities]
      properties:
        id:
          type: string
          example: navidrome
        name:
          type: string
        icon:
          type: string
        playback:
          type: string
          enum: [stream, remote]
        linkMethod:
          type: string
          enum: [credentials, oauth2]
        fields:
          type: array
          description: The form to show for `credentials` providers. Empty for `oauth2`.
          items:
            $ref: "#/components/schemas/LinkField"
        capabilities:
          type: object
          required: [search, playlists, artwork, lyrics, isrc]
          properties:
            search:
              type: array
              items:
                type: string
                enum: [track, album, artist, playlist]
            playlists:
              type: boolean
            artwork:
              type: boolean
            lyrics:
              type: boolean
            isrc:
              type: boolean

    LinkField:
      type: object
      required: [name, label, kind, required]
      properties:
        name:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [text, url, secret]
          description: "`secret` fields must be masked."
        required:
          type: boolean
        placeholder:
          type: string
        help:
          type: string

    ServiceLink:
      type: object
      required: [id, provider, accountLabel, status, createdAt]
      properties:
        id:
          type: string
        provider:
          type: string
        accountLabel:
          type: string
          example: alice on music.example.com
        status:
          type: string
          enum: [ok, needs_relink, error]
          description: "`needs_relink`: the service stopped accepting the credentials; link again."
        statusDetail:
          type: string
        createdAt:
          type: string
          format: date-time
        lastOkAt:
          type: string
          format: date-time

    CreateLinkRequest:
      type: object
      required: [provider, fields]
      properties:
        provider:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string

    RelinkRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            type: string

    BeginOAuthLinkRequest:
      type: object
      description: Set `provider` to link a new account, or `linkId` to re-link one.
      properties:
        provider:
          type: string
        linkId:
          type: string
